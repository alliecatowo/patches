# pnpm 11: postinstall/build scripts are blocked unless allowed here (reviewed native deps only).
allowBuilds:
  sharp: true
  '@swc/core': true
  esbuild: true
  '@napi-rs/keyring': true
  '@node-rs/argon2': true
  protobufjs: true
  unrs-resolver: true
  workerd: true

minimumReleaseAgeExclude:
  - expo-file-system@57.0.5
  - expo-image-picker@57.0.12

# Transitive-only security floors (no direct dependency path to bump). Remove when upstream catches up.
overrides:
  'brace-expansion@<1.1.21': ^1.1.21 # minimatch@3 (eslint tooling)
  'fast-uri@<3.1.7': ^3.1.7 # ajv@8
  'vite@<6.4.3': ^6.4.3 # vitepress@1 (docs site build only)
  'qs@<6.16.0': ^6.16.0 # express/body-parser (Dependabot alerts 7, 8)
  'esbuild@0.28.1': 0.28.2 # Dependabot alert 4
  'esbuild@0.27.7': 0.28.2 # tsup@8 (Dependabot alert 4; dev server file-read, fixed in 0.28.1)
  'uuid@<11.1.1': ^11.1.1 # xcode@3 via expo (CJS-compatible; Dependabot alert 3)
