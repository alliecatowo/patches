  eslint-plugin-react-hooks: ^7.1.1
  globals: ^17.11.0
  prettier: ^3.9.6
  '@types/pg': ^8.23.1
  '@nestjs/cli': ^11.0.24
  grpc-health-check: ^2.1.0
