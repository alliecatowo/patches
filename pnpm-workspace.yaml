  '@nestjs/microservices': ^11.2.1
  '@nestjs/config': ^4.0.4
  '@nestjs/typeorm': ^11.0.3
  '@nestjs/throttler': ^6.5.0
  '@nestjs/testing': ^11.2.1
  '@nestjs/platform-express': ^11.2.1
  reflect-metadata: ^0.2.2
  rxjs: ^7.8.2
  # grpc / proto
  '@grpc/grpc-js': ^1.14.4
  '@grpc/proto-loader': ^0.8.1
  ts-proto: ^2.12.1
  # data
  typeorm: ^1.1.0
  pg: ^8.23.0
  zod: ^4.4.3
  # tui
  ink: ^7.1.1
  '@inkjs/ui': ^2.0.0
  ink-testing-library: ^4.0.0
  react: ^19.2.8
  '@types/react': ^19.2.18
  # media
  sharp: ^0.35.3
  turbo: ^2.10.11
  eslint: ^10.9.0
  '@eslint/js': ^10.0.1
  typescript-eslint: ^8.67.0
