syntax = "proto3";

package patches.v1;

import "patches/v1/labels.proto";
import "patches/v1/moderation.proto";

// Node discovery (spec §163, §168, §174) — always unauthenticated. A client calls
// `GetNodeInfo` before assuming any policy (registration mode, limits, capabilities) rather
// than hardcoding the reference node's behavior.
service NodeService {
  rpc GetNodeInfo(GetNodeInfoRequest) returns (GetNodeInfoResponse);

  // Operator transparency (spec §197.6): what this node's operators do with your data and
  // your safety. Deliberately a separate RPC from `GetNodeInfo` — this document is larger,
  // changes rarely, and is cached on a different schedule. A node that publishes nothing
  // here has said so; clients render an empty policy as "this node publishes no policy"
  // rather than hiding the screen.
  rpc GetNodePolicy(GetNodePolicyRequest) returns (GetNodePolicyResponse);
}

enum RegistrationMode {
  REGISTRATION_MODE_UNSPECIFIED = 0;
  REGISTRATION_MODE_OPEN = 1;
  REGISTRATION_MODE_INVITE_ONLY = 2;
}

// Input limits this node enforces (spec §58) — clients validate/render against these rather
// than hardcoding the reference node's numbers.
message NodeLimits {
  uint32 post_body_max_chars = 1;
  uint32 bio_max_chars = 2;
  uint32 display_name_max_chars = 3;
  uint32 handle_max_chars = 4;
  uint32 location_text_max_chars = 5;
  uint32 website_url_max_chars = 6;
  uint32 alt_text_max_chars = 7;
  uint32 search_query_max_chars = 8;

  // Amendment C size limits (spec §204, A-054) — previously only readable as
  // `@patches/domain` constants a client had no way to see. `packages/domain/src/limits.ts`
  // is the single source every one of these mirrors; see that file's doc comments for the
  // spec citation on each.
  uint32 max_filters_per_actor = 9;
  uint32 max_filter_terms_per_filter = 10;
  uint32 max_filter_lists_published_per_actor = 11;
  uint32 max_filter_list_entries = 12;
  uint32 max_filter_list_subscriptions = 13;
  uint32 max_filter_list_exceptions_per_list = 14;
  uint32 max_labeler_subscriptions_per_actor = 15;

  // Vocabulary values a labeler may publish (spec §200.2, §204) — mirrors
  // `MAX_LABELER_VOCABULARY_ENTRIES` (`apps/server/src/modules/labels/label-validation.ts`),
  // which has no `@patches/domain` counterpart to import instead.
  uint32 max_label_vocabulary_entries = 16;

  uint32 max_appeal_statement_chars = 17;

  // Ready account-export archives kept at a time, per actor (spec §197.3, §204) — a new
  // export request replaces the previous ready archive rather than accumulating more than
  // one. `NodePolicy.retention.export_archive_retention_days` is the companion "how long an
  // archive stays downloadable" figure; this is "how many at once".
  uint32 account_export_max_ready_archives = 18;
}

// Amendment B capabilities (spec §190) that carry a value rather than being a bare named flag
// — unlike `GetNodeInfoResponse.capabilities`, which stays a `repeated string` allow-list of
// on/off features.
message SocialCapabilities {
  // Allow-listed single-codepoint glyphs a custom reaction/nameplate may use (spec §192). An
  // empty list means this node has no custom reaction glyphs enabled.
  repeated string like_glyph_allow_list = 1;

  // The post body ceiling this node currently enforces; may be raised up to 10,000 characters
  // from the 5,000 default (spec §188). Mirrors `NodeLimits.post_body_max_chars` — kept here
  // too so a client reading only the new capabilities message still gets the current value.
  uint32 max_post_chars = 2;

  bool can_create_community = 3;
  bool dm_enabled = 4;

  // 0 means "no retention limit is enforced".
  uint32 dm_retention_days = 5;
}

message GetNodeInfoRequest {}

message GetNodeInfoResponse {
  // Canonical domain of this node (spec §91, §163). Empty until a domain is fixed.
  string domain = 1;

  // Node software version (semver) — distinct from `SystemService.GetServerInfo`'s
  // `protocol_version`/`min_client_version`, which describe the wire protocol, not the
  // software build.
  string software_version = 2;

  RegistrationMode registration_mode = 3;

  NodeLimits limits = 4;

  // Capabilities this node grants (spec §174). There is deliberately no `tier`/`plan`/
  // `premium` field anywhere in this message, and there never will be — clients branch on
  // capabilities only. Clients must tolerate unknown entries.
  repeated string capabilities = 5;

  // Value-carrying capabilities added by Amendment B (spec §188, §190).
  SocialCapabilities social_capabilities = 6;

  // Owner decision (2026-08-19): whether this node's public content is readable without
  // signing in. Default true — `registration_mode ==
  // REGISTRATION_MODE_INVITE_ONLY` gates *posting*, not reading, on its own. `false` means
  // an operator has closed reads entirely: every RPC except `SystemService.*`,
  // `NodeService.GetNodeInfo`/`GetNodePolicy`, and `AuthService.*` then requires an
  // authenticated session (`UNAUTHENTICATED`/`SIGN_IN_REQUIRED`).
  bool public_read = 7;
}

// disabled: no federation at all. allowlist: only explicitly-approved domains. open-with-
// blocklist: federates with any domain except those on `domain_policies` (spec §197.6).
enum FederationStance {
  FEDERATION_STANCE_UNSPECIFIED = 0;
  FEDERATION_STANCE_DISABLED = 1;
  FEDERATION_STANCE_ALLOWLIST = 2;
  FEDERATION_STANCE_OPEN_WITH_BLOCKLIST = 3;
}

// v1 ships exactly one action (spec §201.5); kept as an enum rather than a bare bool for
// forward compatibility with a graduated `limit`/`silence` tier, a §210 sign-off item.
enum DomainPolicyAction {
  DOMAIN_POLICY_ACTION_UNSPECIFIED = 0;
  DOMAIN_POLICY_ACTION_BLOCK = 1;
}

// One entry of the node's public federation domain policy (spec §201.5). `reason_category` is
// the published bounded category — the operator's free-text `domain_blocks.reason` is never
// exposed here (same split as `ModerationLogEntry.reason_category`).
message DomainPolicyEntry {
  string domain = 1;
  DomainPolicyAction action = 2;
  ModerationReasonCategory reason_category = 3;
}

// Retention windows this node enforces (spec §197.6, §204). Zero means "no retention limit is
// enforced", the same convention as `SocialCapabilities.dm_retention_days`.
message RetentionWindows {
  uint32 dm_retention_days = 1;
  uint32 evidence_snapshot_retention_days = 2;
  uint32 uploaded_original_retention_days = 3;
  uint32 log_retention_days = 4;
  uint32 export_archive_retention_days = 5;
}

// Operator transparency document (spec §197.6). Every field is operator-supplied text or an
// enum — never markup, scripts, or remote media (§172, §177).
message NodePolicy {
  string privacy_notice_summary = 1;
  uint32 privacy_notice_version = 2;
  string privacy_notice_url = 3;

  string terms_url = 4;

  string moderator_contact = 5;

  // How appeals are filed (spec §201.3) — human-readable instructions, not a structured
  // shape; the actual mechanism is `AppealService.CreateAppeal`.
  string appeal_instructions = 6;

  FederationStance federation_stance = 7;

  // The public subset of this node's domain policy (spec §201.5).
  repeated DomainPolicyEntry domain_policies = 8;

  // Operator-declared jurisdiction/provider, free text (spec §197.6).
  string data_location = 9;

  RetentionWindows retention = 10;

  // Who runs this node, or an explicit "anonymous operator" statement (spec §197.6).
  string operator_identity = 11;

  // The closed label vocabulary this node's own labeler publishes (spec §200.2).
  repeated LabelVocabularyEntry label_vocabulary = 12;

  // Node-configurable, published here (spec §204's 30-day default).
  uint32 account_deletion_grace_period_days = 13;

  // Node-configurable, published here (spec §204's 14-day default).
  uint32 appeal_window_days = 14;
}

message GetNodePolicyRequest {}

message GetNodePolicyResponse {
  // A node that publishes nothing renders as an all-empty `NodePolicy` — clients MUST render
  // that as "this node publishes no policy" rather than hiding the screen (spec §197.6).
  NodePolicy policy = 1;
}
