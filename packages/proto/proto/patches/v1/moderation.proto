syntax = "proto3";

package patches.v1;

import "google/protobuf/timestamp.proto";
import "patches/v1/actors.proto";
import "patches/v1/common.proto";
import "patches/v1/social_graph.proto";

// User-facing block/mute/report surface (spec §55, §61–64, Phase 6 spec §140). Moderator/admin
// actions (resolving a report, suspending an account) are deliberately not here — spec §65
// puts that in the admin CLI, not a user-facing gRPC service, and "no user-facing API should
// expose internal moderator notes" (§55).
service ModerationService {
  // Rejects a block in either direction of an existing follow by removing it (spec §62); the
  // relationship returned reflects that removal. Idempotent — blocking an already-blocked
  // actor is not an error.
  rpc BlockActor(BlockActorRequest) returns (BlockActorResponse);

  // Idempotent: unblocking an actor the caller has not blocked is not an error.
  rpc UnblockActor(UnblockActorRequest) returns (UnblockActorResponse);

  rpc MuteActor(MuteActorRequest) returns (MuteActorResponse);

  // Idempotent: unmuting an actor the caller has not muted is not an error.
  rpc UnmuteActor(UnmuteActorRequest) returns (UnmuteActorResponse);

  // The caller's own block list, most-recent first.
  rpc ListBlocks(ListBlocksRequest) returns (ListBlocksResponse);

  // The caller's own mute list, most-recent first.
  rpc ListMutes(ListMutesRequest) returns (ListMutesResponse);

  rpc ReportPost(ReportPostRequest) returns (ReportPostResponse);

  rpc ReportActor(ReportActorRequest) returns (ReportActorResponse);

  // Snapshot-backed (spec §183.4): the reported message's content is captured into the report
  // at write time so a later deletion by either party can't destroy the evidence.
  rpc ReportMessage(ReportMessageRequest) returns (ReportMessageResponse);

  // A fourth sibling of `ReportPost`/`ReportActor`/`ReportMessage`, not a generic report RPC
  // (ADR 0020 §9): the node holds no plaintext for an E2EE logical message, so unlike
  // `ReportMessage` this creates an evidence-free `Report` row keyed by
  // `subject_e2ee_logical_message_id`. A follow-up `E2eeService.AttachReportEvidence` call
  // supplies the reporter-disclosed plaintext/opening/franking material against this report id.
  rpc ReportE2eeMessage(ReportE2eeMessageRequest) returns (ReportE2eeMessageResponse);

  // A public transparency instrument about the node's own conduct, not a public record of
  // any individual's conduct (spec §201.4). Unauthenticated. Domain entries are fully
  // identified; account/post/media entries are anonymized by construction — no handle, actor
  // id, or post id, ever.
  rpc ListModerationLog(ListModerationLogRequest) returns (ListModerationLogResponse);

  // The caller's own moderation notices — the private, notified, appealable read projection
  // of `admin_audit_log` rows that acted on them (spec §201.2).
  rpc ListMyModerationNotices(ListMyModerationNoticesRequest) returns (ListMyModerationNoticesResponse);
}

enum ReportReason {
  REPORT_REASON_UNSPECIFIED = 0;
  REPORT_REASON_SPAM = 1;
  REPORT_REASON_HARASSMENT = 2;
  REPORT_REASON_HATE_SPEECH = 3;
  REPORT_REASON_ILLEGAL_CONTENT = 4;
  REPORT_REASON_IMPERSONATION = 5;
  REPORT_REASON_OTHER = 6;
}

message BlockActorRequest {
  string actor_id = 1;
}

message BlockActorResponse {
  Relationship relationship = 1;
}

message UnblockActorRequest {
  string actor_id = 1;
}

message UnblockActorResponse {
  Relationship relationship = 1;
}

message MuteActorRequest {
  string actor_id = 1;
}

message MuteActorResponse {
  Relationship relationship = 1;
}

message UnmuteActorRequest {
  string actor_id = 1;
}

message UnmuteActorResponse {
  Relationship relationship = 1;
}

message ListBlocksRequest {
  string cursor = 1;
  uint32 limit = 2;
}

message ListBlocksResponse {
  repeated Actor actors = 1;
  PageInfo page = 2;
}

message ListMutesRequest {
  string cursor = 1;
  uint32 limit = 2;
}

message ListMutesResponse {
  repeated Actor actors = 1;
  PageInfo page = 2;
}

message ReportPostRequest {
  string post_id = 1;
  ReportReason reason = 2;

  // Optional free text. Max 2,000 characters (spec §58-style bound).
  string details = 3;
}

message ReportPostResponse {
  string report_id = 1;
}

message ReportActorRequest {
  string actor_id = 1;
  ReportReason reason = 2;

  // Optional free text. Max 2,000 characters (spec §58-style bound).
  string details = 3;
}

message ReportActorResponse {
  string report_id = 1;
}

message ReportMessageRequest {
  string message_id = 1;
  ReportReason reason = 2;

  // Optional free text. Max 2,000 characters (spec §58-style bound).
  string details = 3;
}

message ReportMessageResponse {
  string report_id = 1;
}

message ReportE2eeMessageRequest {
  // An `E2eeLogicalMessage.id` (client-generated logical id shared across every per-device
  // envelope) — never a mailbox envelope id, which is per-device.
  string logical_message_id = 1;
  ReportReason reason = 2;

  // Optional free text. Max 2,000 characters (spec §58-style bound). Never message plaintext —
  // that is disclosed separately, and only with explicit consent, via
  // `E2eeService.AttachReportEvidence` (ADR 0020 §9).
  string details = 3;
}

message ReportE2eeMessageResponse {
  string report_id = 1;
}

// A bounded vocabulary (spec §202's `MODERATION_LOG_REASON_CATEGORIES`), derived from
// `docs/product/moderation.md`'s guideline list — never a report's free-text `details`, never
// a moderator's internal note. Published on `domain_blocks` (as the public counterpart to the
// operator's free-text `reason`) and on every `ModerationLogEntry`.
enum ModerationReasonCategory {
  MODERATION_REASON_CATEGORY_UNSPECIFIED = 0;
  MODERATION_REASON_CATEGORY_HARASSMENT = 1;
  MODERATION_REASON_CATEGORY_HATE = 2;
  MODERATION_REASON_CATEGORY_THREATS = 3;
  MODERATION_REASON_CATEGORY_DOXXING = 4;
  MODERATION_REASON_CATEGORY_IMPERSONATION = 5;
  MODERATION_REASON_CATEGORY_SPAM = 6;
  MODERATION_REASON_CATEGORY_ILLEGAL_CONTENT = 7;
  MODERATION_REASON_CATEGORY_NCII = 8;
  MODERATION_REASON_CATEGORY_INFRASTRUCTURE_ABUSE = 9;
  MODERATION_REASON_CATEGORY_OTHER = 10;
}

// The node enforcement actions that generate a moderation notice (spec §201.2), plus the
// domain-level action published in the moderation log (spec §201.4-§201.5).
enum ModerationActionType {
  MODERATION_ACTION_TYPE_UNSPECIFIED = 0;
  MODERATION_ACTION_TYPE_WARN = 1;
  MODERATION_ACTION_TYPE_SUSPEND = 2;
  MODERATION_ACTION_TYPE_BAN = 3;
  MODERATION_ACTION_TYPE_POST_REMOVAL = 4;
  MODERATION_ACTION_TYPE_MEDIA_TAKEDOWN = 5;
  MODERATION_ACTION_TYPE_DOMAIN_BLOCK = 6;
}

enum ModerationLogSubjectKind {
  MODERATION_LOG_SUBJECT_KIND_UNSPECIFIED = 0;
  MODERATION_LOG_SUBJECT_KIND_DOMAIN = 1;
  MODERATION_LOG_SUBJECT_KIND_ACCOUNT = 2;
  MODERATION_LOG_SUBJECT_KIND_POST = 3;
  MODERATION_LOG_SUBJECT_KIND_MEDIA = 4;
}

// A public, anonymized transparency record (spec §201.4). Account/post/media entries never
// carry a handle, actor id, or post id — the acted-upon actor already has the full,
// identified version in their own `ModerationNotice`, and moderators have it in
// `admin_audit_log`. A domain entry is fully identified because it is the node's own
// federation decision about its own conduct, not a record of any individual's conduct.
message ModerationLogEntry {
  string id = 1;
  ModerationActionType action = 2;
  ModerationLogSubjectKind subject_kind = 3;

  // Set only when `subject_kind == MODERATION_LOG_SUBJECT_KIND_DOMAIN`.
  string subject_domain = 4;

  ModerationReasonCategory reason_category = 5;

  // Whether this action was appealed — never the appeal's content (spec §201.3, §208).
  bool appealed = 6;

  google.protobuf.Timestamp created_at = 7;
}

message ListModerationLogRequest {
  string cursor = 1;
  uint32 limit = 2;
}

message ListModerationLogResponse {
  repeated ModerationLogEntry entries = 1;
  PageInfo page = 2;
}

// A private, notified read projection of the `admin_audit_log` row that enforced an action
// against the caller (spec §201.2) — not a second source of truth. Contrast with a label
// (`LabelService`, spec §200.4): a labeler's judgement is never notified, an enforcement
// action always is.
message ModerationNotice {
  string id = 1;
  ModerationActionType action = 2;

  // Empty unless the action concerned a specific post.
  string post_id = 3;

  ModerationReasonCategory reason_category = 4;

  // Purpose-written for the subject at resolution time — never `reports.moderator_note`
  // (spec §55, §201.2, §208).
  string explanation = 5;

  google.protobuf.Timestamp created_at = 6;

  // Deadline to file an appeal (`AppealService.CreateAppeal`); unset if the appeal window has
  // already closed or no appeal applies to this action.
  google.protobuf.Timestamp appeal_deadline = 7;

  // True once the caller has filed an appeal against this notice.
  bool appealed = 8;
}

message ListMyModerationNoticesRequest {
  string cursor = 1;
  uint32 limit = 2;
}

message ListMyModerationNoticesResponse {
  repeated ModerationNotice notices = 1;
  PageInfo page = 2;
}
