syntax = "proto3";

package patches.v1;

// Cursor pagination envelope (spec §46).
//
// Patches never uses offset pagination for timelines. Every list RPC follows the
// same shape:
//
//   message ListXxxRequest {
//     // Opaque cursor from a previous response's `page.next_cursor`.
//     // Empty/absent means "start from the newest item".
//     string cursor = 1;
//     // Server clamps this to a sane maximum.
//     uint32 limit = 2;
//   }
//
//   message ListXxxResponse {
//     repeated Xxx items = 1;
//     PageInfo page = 2;
//   }
//
// Canonical ordering is `created_at DESC, id DESC`. The cursor is generated by
// the server and is opaque: clients must never construct or parse one.
message PageInfo {
  // Opaque cursor for the next page. Empty when there is no next page.
  string next_cursor = 1;

  // True when another page exists. Clients should key "load more" off this
  // rather than off `next_cursor` being non-empty.
  bool has_more = 2;
}
