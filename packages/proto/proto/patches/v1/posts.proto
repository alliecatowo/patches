syntax = "proto3";

package patches.v1;

import "google/protobuf/timestamp.proto";
import "patches/v1/actors.proto";
import "patches/v1/common.proto";
import "patches/v1/communities.proto";
import "patches/v1/filters.proto";
import "patches/v1/labels.proto";

// Posts and replies — there is no separate comment entity (spec §23–26, §51).
service PostService {
  // Requires `client_request_id` (spec §45); the backend enforces idempotency conceptually
  // on (author_actor_id, client_request_id) so a client-side retry cannot create a
  // duplicate post.
  rpc CreatePost(CreatePostRequest) returns (CreatePostResponse);

  rpc GetPost(GetPostRequest) returns (GetPostResponse);

  // Soft delete/tombstone (spec §25) — never a hard delete over this API.
  rpc DeletePost(DeletePostRequest) returns (DeletePostResponse);

  // Cursor-paginated, depth-bounded thread read (spec §24). Never loads an arbitrarily large
  // thread in one call.
  rpc ListReplies(ListRepliesRequest) returns (ListRepliesResponse);

  // In-place body/content-warning/media edit (spec §189, §26 amended). Up to 20 edits per
  // post (spec §188); every edit is snapshotted to `post_edits` before it is applied, readable
  // via `ListPostEdits`.
  rpc EditPost(EditPostRequest) returns (EditPostResponse);

  // The edit history of a post, most-recent first.
  rpc ListPostEdits(ListPostEditsRequest) returns (ListPostEditsResponse);

  // Pins one of the caller's own posts to their profile. Up to 3 pinned posts per actor
  // (spec §188); `position` (0-2) sets display order.
  rpc PinPost(PinPostRequest) returns (PinPostResponse);

  // Idempotent: unpinning a post that isn't pinned is not an error.
  rpc UnpinPost(UnpinPostRequest) returns (UnpinPostResponse);

  // Full-text search over local post bodies (Postgres `websearch_to_tsquery`). Results are
  // strictly newest-first, keyset-paged like every other list RPC — there is no relevance
  // score and never a `sort`/`order` parameter (spec §194).
  rpc SearchPosts(SearchPostsRequest) returns (SearchPostsResponse);
}

enum PostType {
  POST_TYPE_UNSPECIFIED = 0;
  POST_TYPE_NOTE = 1;
  POST_TYPE_LINK = 2;
}

enum PostVisibility {
  POST_VISIBILITY_UNSPECIFIED = 0;
  POST_VISIBILITY_PUBLIC = 1;
  POST_VISIBILITY_UNLISTED = 2;
  POST_VISIBILITY_FOLLOWERS = 3;
}

// Who may quote a post (spec §189, §192 — re-checked server-side on every `CreatePost` quote,
// never inferred from what the client was shown).
enum QuotePolicy {
  QUOTE_POLICY_UNSPECIFIED = 0;
  QUOTE_POLICY_ANYONE = 1;
  QUOTE_POLICY_FOLLOWERS = 2;
  QUOTE_POLICY_NOBODY = 3;
}

// One attached image (spec §27–28). `thumbnail_url`/`download_url` are intentionally absent
// — they arrive as new fields once `MediaService.GetMediaDownload` exists; adding fields
// later is additive and non-breaking, so there is nothing to reserve now.
message MediaAttachment {
  string media_id = 1;

  // Max 1,000 characters (spec §58).
  string alt_text = 2;

  uint32 width = 3;
  uint32 height = 4;
  string mime_type = 5;

  // 0-based display order within the post (spec §27's `post_media.position`).
  uint32 position = 6;
}

message PostCounts {
  uint32 replies = 1;
  uint32 likes = 2;
  uint32 reposts = 3;
  uint32 quotes = 4;
}

// Only meaningful for an authenticated viewer; all fields are false for an anonymous read.
message PostViewerState {
  bool liked = 1;
  bool bookmarked = 2;
  bool reposted = 3;
}

// Which mechanism produced a `Post.filtered_by` hint (spec §199.3's provenance requirement —
// "a viewer must always be able to answer 'why did this disappear, and who decided that?'").
enum FilteredByProvenance {
  FILTERED_BY_PROVENANCE_UNSPECIFIED = 0;
  FILTERED_BY_PROVENANCE_FILTER = 1;
  FILTERED_BY_PROVENANCE_FILTER_LIST = 2;
}

// Set only for `FILTER_ACTION_COLLAPSE`/`FILTER_ACTION_WARN` (spec §198.3) — a `hide` match
// omits the row from the response entirely and is never represented here.
message FilteredByHint {
  FilteredByProvenance provenance = 1;

  // The filter's name, or the filter list's `display_name` — rendered as "filtered: <name>".
  string name = 2;

  // Set only when `provenance == FILTERED_BY_PROVENANCE_FILTER_LIST` — the list's publisher,
  // rendered as "via @alice" (spec §199.3).
  Actor list_owner = 3;

  // Never `FILTER_ACTION_HIDE` (a hidden post is never returned to the client at all).
  FilterAction action = 4;
}

message Post {
  string id = 1;
  Actor author = 2;

  // Empty when `deleted` is true, or when the post is media/link-only.
  string body = 3;

  PostType post_type = 4;

  // Set only when `post_type == POST_TYPE_LINK`.
  string link_url = 5;

  PostVisibility visibility = 6;

  // Empty for a root post.
  string in_reply_to_id = 7;

  // A root post's `root_post_id` equals its own `id` (spec §24).
  string root_post_id = 8;

  repeated MediaAttachment media = 9;

  google.protobuf.Timestamp created_at = 10;

  // Unset (zero value) if the post has never been edited (spec §26).
  google.protobuf.Timestamp edited_at = 11;

  // Tombstone flag (spec §25). `body`/`media` are empty and the client should render
  // `[deleted]` when true.
  bool deleted = 12;

  PostCounts counts = 13;
  PostViewerState viewer_state = 14;

  // Optional click-to-reveal label (e.g. "spoilers"); empty means none. Same length budget as
  // `body` (spec §58).
  string content_warning = 15;

  // Unset unless this post quotes another. Only one level is ever populated here even if the
  // quoted post itself quotes another post — quoted-post nesting renders one level deep
  // (spec §188).
  Post quoted_post = 16;

  // Unset for a post not posted into a community.
  Community community = 17;

  QuotePolicy quote_policy = 18;

  // Set only by a feed list RPC (`FeedService.ListHomeFeed`, spec §180.1) for a post reached
  // via a repost, never by `GetPost`/`ListReplies`/etc. Up to 3 reposters, newest repost
  // first, collapsed within the response page — the "reposted by @handle" attribution line.
  // Unset (empty) for a post shown by its own authorship.
  repeated Actor reposted_by = 19;

  // How many distinct reposters were collapsed into this entry within this page — may exceed
  // `reposted_by`'s length (spec §180.1's "up to three reposters" naming cap). Zero whenever
  // `reposted_by` is empty.
  uint32 reposted_by_total = 20;

  // Set only when a viewer's own filter or filter-list subscription matched this post with
  // `collapse`/`warn` (spec §198.3, §203). Unset for a `hide` match — that post is never
  // returned at all — and unset when nothing matched.
  FilteredByHint filtered_by = 21;

  // Labels from labelers the viewer subscribes to only (spec §200.3, §203) — never a global
  // annotation. Empty for an anonymous read or a viewer with no labeler subscriptions.
  repeated Label labels = 22;

  // Federation origin domain (spec §163), same convention as `Actor.home_server`. Empty for a
  // post authored on this node — render with no domain suffix. Set to the authoring node's
  // domain for a post that arrived via federation.
  string origin_server = 23;
}

message CreatePostRequest {
  // Idempotency key (spec §45).
  string client_request_id = 1;

  // Max 5,000 Unicode characters (spec §58). May be empty for a link/media-only post, but a
  // post must contain at least one of text, an image, or a link (spec §23) — enforced
  // service-side.
  string body = 2;

  string link_url = 3;
  PostVisibility visibility = 4;

  // Empty for a root post.
  string in_reply_to_id = 5;

  // Up to 4 (spec §28), already-uploaded and `READY` media ids, in display order.
  repeated string media_ids = 6;

  // Optional click-to-reveal label (e.g. "spoilers"); empty means none. Same length budget as
  // `body` (spec §58).
  string content_warning = 7;

  // Empty unless this post quotes another. Re-checked server-side against the quoted post's
  // `quote_policy` and blocks at write time (spec §192) — never trust a client-side check.
  string quoted_post_id = 8;

  // Empty unless this post is being created into a community. Immutable after insert
  // (spec §189).
  string community_id = 9;

  QuotePolicy quote_policy = 10;
}

message CreatePostResponse {
  Post post = 1;
}

message GetPostRequest {
  string id = 1;
}

message GetPostResponse {
  Post post = 1;
}

message DeletePostRequest {
  string id = 1;
}

message DeletePostResponse {
  // The now-tombstoned post, so the caller can render `[deleted]` without a refetch.
  Post post = 1;
}

message ListRepliesRequest {
  string post_id = 1;
  string cursor = 2;
  uint32 limit = 3;

  // Server clamps this to a sane maximum; bounds how deep into the reply tree to descend
  // (spec §24).
  uint32 max_depth = 4;
}

message ListRepliesResponse {
  repeated Post posts = 1;
  PageInfo page = 2;
}

// A single prior version of a post, snapshotted immediately before an `EditPost` call
// overwrites it (spec §189's `post_edits` table).
message PostEdit {
  string id = 1;
  string post_id = 2;
  string previous_body = 3;
  string previous_content_warning = 4;
  repeated MediaAttachment previous_media = 5;
  string edited_by_actor_id = 6;
  google.protobuf.Timestamp created_at = 7;
}

message EditPostRequest {
  string id = 1;
  string body = 2;
  string content_warning = 3;
  repeated string media_ids = 4;
}

message EditPostResponse {
  Post post = 1;
}

message ListPostEditsRequest {
  string post_id = 1;
  string cursor = 2;
  uint32 limit = 3;
}

message ListPostEditsResponse {
  repeated PostEdit edits = 1;
  PageInfo page = 2;
}

message PinPostRequest {
  string post_id = 1;

  // 0-2 (spec §188's 3-pin ceiling).
  uint32 position = 2;
}

message PinPostResponse {
  Post post = 1;
}

message UnpinPostRequest {
  string post_id = 1;
}

message UnpinPostResponse {
  Post post = 1;
}

message SearchPostsRequest {
  // Server rejects empty/whitespace-only and caps at 200 Unicode characters.
  string query = 1;
  string cursor = 2;
  uint32 limit = 3;

  // Optional filter: only posts by this local handle. Empty means no author filter.
  string author_handle = 4;

  // Replies are excluded by default (the common "search posts" expectation); set true to
  // include them in the results.
  bool include_replies = 5;
}

message SearchPostsResponse {
  repeated Post posts = 1;
  PageInfo page = 2;
}
