syntax = "proto3";

package patches.v1;

import "google/protobuf/timestamp.proto";
import "patches/v1/actors.proto";
import "patches/v1/common.proto";
import "patches/v1/e2ee.proto";

// The generic conversation surface (spec §183, §188–190; ADR 0030 §B-095). Every conversation
// today is `E2EE_V1` (`E2eeService.CreateE2eeConversation` is the only way to create one, and
// `E2eeService.SendEnvelopes` the only way to add a message to one) — this service only lists,
// reads, and tracks membership/read-state for conversations, never their content. The plaintext
// send/read/request RPCs this service used to carry (`SendMessage`, `ListMessages`,
// `DeleteMessage`, `CreateConversation`, and the whole `MessageRequest` flow) were removed by
// ADR 0030's pre-alpha consolidation policy the same change set E2EE-only conversations shipped
// in — never federated (ADR 0020 §13).
service DirectMessageService {
  rpc ListConversations(ListConversationsRequest) returns (ListConversationsResponse);

  rpc GetConversation(GetConversationRequest) returns (GetConversationResponse);

  // Always rejected with `UNIMPLEMENTED` (ADR 0030 §B-095): every conversation is `E2EE_V1`,
  // so leaving is a group-control transition — a silent `left_at` flip would desync the
  // membership epoch and roster chain every other member verifies. Self-removal goes through
  // `E2eeService.RemoveE2eeMember` with `actor_id` set to the caller.
  rpc LeaveConversation(LeaveConversationRequest) returns (LeaveConversationResponse);

  rpc MarkConversationRead(MarkConversationReadRequest) returns (MarkConversationReadResponse);
}

enum ConversationKind {
  CONVERSATION_KIND_UNSPECIFIED = 0;
  CONVERSATION_KIND_DIRECT = 1;
  CONVERSATION_KIND_GROUP = 2;
}

message ConversationMember {
  Actor actor = 1;
  google.protobuf.Timestamp joined_at = 2;

  // Unset while still a member.
  google.protobuf.Timestamp left_at = 3;

  // Empty if nothing has been read yet. An `E2eeLogicalMessage` id (opaque to this service) —
  // never a plaintext message id, since the node holds no plaintext (ADR 0020, ADR 0030).
  string last_read_message_id = 4;

  bool muted = 5;
}

message Conversation {
  string id = 1;
  ConversationKind kind = 2;
  Actor created_by = 3;
  repeated ConversationMember members = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp last_message_at = 6;

  // Unread count for the caller specifically — never populated for anyone else.
  uint32 unread_count = 7;

  // Which security mode this conversation was created in (ADR 0020; ADR 0030 §B-095). Read-only
  // and fixed at creation: there is no RPC anywhere in this schema that converts a conversation
  // between modes. Always `CONVERSATION_SECURITY_MODE_E2EE_V1` today —
  // `E2eeService.CreateE2eeConversation` is the only way to produce a `Conversation`.
  ConversationSecurityMode security_mode = 8;
}

message ListConversationsRequest {
  string cursor = 1;
  uint32 limit = 2;
}

message ListConversationsResponse {
  repeated Conversation conversations = 1;
  PageInfo page = 2;
}

message GetConversationRequest {
  string id = 1;
}

message GetConversationResponse {
  Conversation conversation = 1;
}

message LeaveConversationRequest {
  string conversation_id = 1;
}

message LeaveConversationResponse {}

message MarkConversationReadRequest {
  string conversation_id = 1;

  // Marks every message at or before this one as read. An `E2eeLogicalMessage` id.
  string through_message_id = 2;
}

message MarkConversationReadResponse {}
