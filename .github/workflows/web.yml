# Builds the browser client from the exact main commit that passed CI and, once the
# production environment is configured, publishes it to Cloudflare Pages.

name: Web

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: web-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  deploy:
    name: build + deploy (Cloudflare Pages)
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: ./.github/actions/setup

      - name: Build the web client
        run: pnpm --filter @patches/web... build
        env:
          VITE_PATCHES_API_BASE: ${{ vars.WEB_API_BASE }}
          GITHUB_SHA: ${{ github.event.workflow_run.head_sha }}

      # B-168: fails the job (and therefore blocks the deploy step below) if any built
      # JS chunk exceeds apps/web/bundle-budget.json's thresholds. Runs against the
      # exact artifact the deploy step is about to publish, no extra build.
      - name: Check bundle size budget
        run: pnpm --filter @patches/web run bundle:check

      - name: Build bundle report artifact
        if: always()
        run: pnpm --filter @patches/web run bundle:analyze
        env:
          VITE_PATCHES_API_BASE: ${{ vars.WEB_API_BASE }}
          GITHUB_SHA: ${{ github.event.workflow_run.head_sha }}

      - name: Upload bundle report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-bundle-report
          path: apps/web/dist-analyze/bundle-report.html
          if-no-files-found: warn

      - name: Deploy to Cloudflare Pages
        if: ${{ vars.WEB_DEPLOY_ENABLED == 'true' }}
        run: pnpm exec wrangler pages deploy apps/web/dist --project-name patches-web --branch main --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
