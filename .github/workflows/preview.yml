# Per-PR temporary FULL-STACK preview environments (B-105): one Fly app (server +
# worker process groups, one machine each) + one Neon branch per pull request
# targeting a mainline branch (main, swarm/e2ee-federation-niceties).
#
# deploy job   (opened/synchronize/reopened): create-or-reuse Neon branch `pr-<N>`,
#              run migrations against it, deploy app `patches-pr-<N>` with BOTH
#              processes (federation off, console email, PUBLIC_READ=true; media
#              on iff all R2_PREVIEW_* secrets exist — see capability detection
#              below). When Cloudflare credentials are present, ALSO build apps/web
#              against the preview API and publish it to Cloudflare Pages, then add
#              the Pages origin to the Fly app's WEB_ORIGINS so the Connect CORS
#              accepts it (an unset/empty WEB_ORIGINS denies every cross-origin
#              browser request). Finally post/update a `<!-- patches-preview -->` PR
#              comment carrying the capability matrix.
# teardown job (closed — merged or not — or manual dispatch action=teardown): destroy
#              the Fly app, delete the Neon branch, and sweep this PR's Cloudflare
#              Pages deployments. Best-effort per resource and idempotent (an
#              already-destroyed stack is a success), but honest in aggregate (B-204):
#              any resource that errors for a reason other than "already gone" turns
#              the run red instead of being swallowed by continue-on-error.
#
# Required secrets (repository or `preview` environment — Settings → Secrets):
#   FLY_API_TOKEN      flyctl token allowed to create/destroy apps in the target org
#                      (org-scoped: `fly tokens org <org>` — Fly's review-apps
#                      blueprint's recommendation)
#   NEON_API_KEY       Neon API key for the preview project (project-scoped org key
#                      if the account supports it — docs/research/neon-branching.md)
#   NEON_PROJECT_ID    Neon project id previews branch from (e.g. shy-recipe-96135980)
# Optional secrets (media capability — set ALL FIVE or none):
#   R2_PREVIEW_ACCOUNT_ID / R2_PREVIEW_ACCESS_KEY_ID / R2_PREVIEW_SECRET_ACCESS_KEY /
#   R2_PREVIEW_BUCKET / R2_PREVIEW_ENDPOINT
#                      scoped to a dedicated PREVIEW R2 bucket, never the production
#                      one. When all five are present the workflow sets the app's
#                      R2_* secrets and media (uploads + worker derivative jobs) is
#                      live; when any is missing, media degrades cleanly (R2_* are
#                      optional in packages/config's storageEnvSchema and the media
#                      module errors at call time, not boot time).
# Optional Cloudflare Pages credentials (web-preview capability — set BOTH or none):
#   CLOUDFLARE_API_TOKEN  (secret) Cloudflare API token with Pages deploy permission
#   CLOUDFLARE_ACCOUNT_ID (variable) the Cloudflare account id to deploy Pages into
#                      When both are present the workflow builds apps/web with
#                      VITE_PATCHES_API_BASE pointing at the preview Fly Connect
#                      edge and deploys it to Cloudflare Pages (project `patches-web`,
#                      branch `pr-<N>`); when either is missing, the web preview is
#                      skipped and the backend-only preview is unaffected.
#   NEON_BRANCH_PASSWORD  Not read by this workflow: the branch role password comes
#                      from `neon connection-string` (the Neon API hands the CLI the
#                      password; verified in the CLI source). Keep this secret only
#                      if you want the documented manual-psql fallback in
#                      docs/operations/preview-environments.md to work.
# Optional repository variables:
#   NEON_PREVIEW_PARENT_BRANCH  branch name/id to parent previews on. UNSET = the
#                      project's default branch (production!) — see the data warning
#                      in the runbook before relying on that default.
#   FLY_PREVIEW_ORG    Fly org for preview apps (default: personal)
#
# Fork PRs are skipped by the deploy job's `if:` — GitHub never exposes these
# secrets to `pull_request` runs from forks, so a deploy there can only fail. The
# teardown job skips forks and bot-authored PRs for the same reason: no secrets
# means no stack was ever deployed, so there is nothing to destroy (and its honest
# verdict would otherwise fail loudly on every fork-PR close). Manual dispatch
# (`action=teardown`) still works for any PR number — dispatch requires write
# access, so it always runs with secrets.
# Nothing here touches mainline (`main`, `swarm/e2ee-federation-niceties`) deploys.

name: Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main, swarm/e2ee-federation-niceties]
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to act on (deploy requires it open; teardown works either way)
        required: true
        type: number
      action:
        description: What to do with that PR's preview stack
        required: false
        default: deploy
        type: choice
        options:
          - deploy
          - teardown

permissions:
  contents: read
  pull-requests: write

jobs:
  deploy:
    name: deploy (Fly preview + Neon branch)
    # pull_request: skip forks (no secrets), the closed event (teardown's job), and
    # bot-authored PRs — dependabot/renovate runs get NO secrets (GitHub withholds
    # them from Dependabot-triggered workflows), so a deploy there can only die at
    # the first Neon/flyctl call with "Cannot run interactive auth in CI" (observed
    # 2026-08-25, PR #80). workflow_dispatch: allowed for action=deploy (the
    # default); the resolve step below fails fast on a missing or closed PR.
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.action == 'deploy') ||
      (github.event_name == 'pull_request' && github.event.action != 'closed' &&
       github.event.pull_request.head.repo.fork == false &&
       github.event.pull_request.user.type != 'Bot')
    runs-on: ubuntu-latest
    concurrency:
      # ONE concurrency group per PR stack, shared with the teardown job (B-204):
      # a new push cancels the superseded deploy, and a close-teardown entering the
      # group cancels any in-flight or PENDING deploy of the same PR instead of
      # racing it (separate groups previously let a deploy finish after teardown
      # and re-orphan the whole stack — the 2026-08-26 incident).
      group: preview-stack-${{ github.event.pull_request.number || inputs.pr_number }}
      cancel-in-progress: true
    env:
      PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      # Runs before checkout on purpose: dispatch needs the PR's head sha, and gh is
      # preinstalled on the runner. Also the only place that validates a dispatch's
      # PR number (exists + open) — everything downstream can then assume it.
      - name: Resolve PR head commit (workflow_dispatch)
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          state="$(gh pr view "$PR_NUMBER" --json state,headRefOid --jq '.state + " " + .headRefOid')" || {
            echo "PR #$PR_NUMBER not found." >&2; exit 1; }
          pr_state="${state%% *}"
          [ "$pr_state" = "OPEN" ] || { echo "PR #$PR_NUMBER is $pr_state; refusing to deploy a preview for it." >&2; exit 1; }
          echo "PR_HEAD_SHA=${state##* }" >> "$GITHUB_ENV"

      - uses: actions/checkout@v7
        with:
          # The exact PR head commit — on dispatch github.sha is the default branch.
          ref: ${{ env.PR_HEAD_SHA || github.event.pull_request.head.sha }}

      - uses: ./.github/actions/setup

      # Same CLI major/minor as the mise.toml pin (npm package `neon` ships only the
      # `neon` bin — `neonctl` is the legacy Homebrew package name).
      - name: Install Neon CLI
        # mise-managed node puts npm's global bin inside the mise install dir, which is
        # NOT on PATH for later steps — export it explicitly (first live run: exit 127).
        run: |
          npm install -g neon@3.6.0
          echo "$(npm prefix -g)/bin" >> "$GITHUB_PATH"

      - name: Set up flyctl
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # v1.6

      - name: Create or reuse Neon branch (pr-<N>)
        run: |
          set -euo pipefail
          branch="pr-${PR_NUMBER}"
          # 7-day hard expiry is the fail-safe for cancelled runs / lost events;
          # a re-deploy (synchronize) pushes it out again. Explicit teardown on PR
          # close remains the normal cleanup path.
          expires="$(date -u -d '+7 days' +%Y-%m-%dT%H:%M:%SZ)"
          if neon branches get "$branch" --project-id "$NEON_PROJECT_ID" --output json --no-color >/dev/null 2>&1; then
            echo "Reusing existing Neon branch $branch (expiry bumped to $expires)."
            neon branches set-expiration "$branch" --project-id "$NEON_PROJECT_ID" --expires-at "$expires" >/dev/null
          else
            # No --parent unless configured: Neon defaults the parent to the
            # project's default branch. vars.NEON_PREVIEW_PARENT_BRANCH overrides
            # (e.g. an anonymized mirror) — see the runbook's data warning.
            args=(--project-id "$NEON_PROJECT_ID" --name "$branch" --expires-at "$expires" --output json --no-color)
            if [ -n "${NEON_PREVIEW_PARENT_BRANCH:-}" ]; then
              args+=(--parent "$NEON_PREVIEW_PARENT_BRANCH")
            fi
            echo "Creating Neon branch $branch (expires $expires)."
            # --suspend-timeout is plan-gated ("modifying the suspend interval is not
            # permitted on this account" on plans without scale-to-zero control) — retry
            # once without it rather than failing the deploy over an idle-suspend knob.
            if ! neon branches create "${args[@]}" --suspend-timeout 300 2>"$RUNNER_TEMP/neon-branch-err.txt" >/dev/null; then
              if grep -q 'suspend interval is not permitted' "$RUNNER_TEMP/neon-branch-err.txt"; then
                echo 'Plan does not allow --suspend-timeout; creating the branch without it.'
                neon branches create "${args[@]}" >/dev/null
              else
                cat "$RUNNER_TEMP/neon-branch-err.txt" >&2
                exit 1
              fi
            fi
          fi

      - name: Fetch branch connection string
        run: |
          set -euo pipefail
          # `neon connection-string` embeds the branch role's password (fetched from
          # the Neon API), so this value is a secret: mask it before it can hit any
          # log, and keep it in GITHUB_ENV only.
          url="$(neon connection-string "pr-${PR_NUMBER}" \
            --project-id "$NEON_PROJECT_ID" \
            --database-name neondb --role-name neondb_owner --no-color \
            | sed 's/&channel_binding=require//')"
          [ -n "$url" ] || { echo "Neon returned an empty connection string" >&2; exit 1; }
          echo "::add-mask::$url"
          echo "DATABASE_URL=$url" >> "$GITHUB_ENV"

      - name: Run migrations against the Neon branch
        # Scoped turbo build — `@patches/database` + its workspace deps (config, proto,
        # …) — not the full 21-workspace `pnpm build`: migrations only need the
        # database package's dist, and this slice is usually restored warm from the
        # setup action's turbo cache (saves ~30-40s per preview deploy).
        run: pnpm --filter @patches/database... build && pnpm db:migrate
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          DATABASE_SSL: 'true'

      # Per-PR throwaway keys (rotated on every deploy — existing preview sessions
      # are invalidated by each push, which is fine for a preview). No shared
      # production secrets ever reach a preview app.
      - name: Generate throwaway JWT + auth-code keys
        run: |
          set -euo pipefail
          pnpm keys:generate > "$RUNNER_TEMP/preview-keys.env"
          for name in JWT_PRIVATE_KEY JWT_PUBLIC_KEY AUTH_CODE_DELIVERY_ACTIVE_KEY_ID AUTH_CODE_DELIVERY_KEYS; do
            value="$(sed -n "s/^${name}=//p" "$RUNNER_TEMP/preview-keys.env")"
            [ -n "$value" ] || { echo "keys:generate output is missing $name" >&2; exit 1; }
            echo "::add-mask::$value"
            echo "$name=$value" >> "$GITHUB_ENV"
          done
          rm -f "$RUNNER_TEMP/preview-keys.env"

      - name: Create Fly app if needed (patches-pr-<N>)
        run: |
          set -euo pipefail
          org="${FLY_PREVIEW_ORG:-personal}"
          # Idempotent: `apps create` fails when the name is taken (every re-deploy).
          # Any other failure (bad token, quota) surfaces in the deploy step below.
          flyctl apps create "patches-pr-${PR_NUMBER}" --org "$org" >/dev/null 2>&1 \
            || echo "Fly app patches-pr-${PR_NUMBER} already exists (or create was refused) — continuing."
        env:
          FLY_PREVIEW_ORG: ${{ vars.FLY_PREVIEW_ORG }}

      # B-154 root cause: a freshly created app has NO IP addresses (flyctl stopped
      # auto-allocating), and without a shared IPv4 there is no <app>.fly.dev DNS —
      # the Connect edge is unreachable from browsers and every login fails with
      # "can't connect to backend" while the machine itself is perfectly healthy.
      # Allocate the free org-shared IPv4 idempotently; re-runs are no-ops.
      - name: Ensure shared IPv4 (DNS for <app>.fly.dev)
        run: |
          set -euo pipefail
          if flyctl ips list --app "patches-pr-${PR_NUMBER}" 2>/dev/null | grep -q "v4"; then
            echo "IPv4 already allocated."
          else
            flyctl ips allocate-v4 --shared --app "patches-pr-${PR_NUMBER}"
          fi

      # Capability detection (documented matrix, never a silent failure): the ONLY
      # optional capability is media, gated on the five R2_PREVIEW_* secrets being
      # ALL present (all-or-none — partial config would half-work). Presence is
      # checked via env mapping since `gh secret list` is unavailable to the
      # workflow itself. Missing → media cleanly degraded (upload/derivative paths
      # error at call time by design in packages/config's storageEnvSchema), and
      # the PR comment says so.
      - name: Detect optional media capability (R2 preview bucket)
        env:
          R2_PREVIEW_ACCOUNT_ID: ${{ secrets.R2_PREVIEW_ACCOUNT_ID }}
          R2_PREVIEW_ACCESS_KEY_ID: ${{ secrets.R2_PREVIEW_ACCESS_KEY_ID }}
          R2_PREVIEW_SECRET_ACCESS_KEY: ${{ secrets.R2_PREVIEW_SECRET_ACCESS_KEY }}
          R2_PREVIEW_BUCKET: ${{ secrets.R2_PREVIEW_BUCKET }}
          R2_PREVIEW_ENDPOINT: ${{ secrets.R2_PREVIEW_ENDPOINT }}
        run: |
          set -euo pipefail
          r2_args_file="$RUNNER_TEMP/preview-r2-args.txt"
          if [ -n "$R2_PREVIEW_ACCOUNT_ID" ] && [ -n "$R2_PREVIEW_ACCESS_KEY_ID" ] && \
             [ -n "$R2_PREVIEW_SECRET_ACCESS_KEY" ] && [ -n "$R2_PREVIEW_BUCKET" ] && \
             [ -n "$R2_PREVIEW_ENDPOINT" ]; then
            for value in "$R2_PREVIEW_ACCOUNT_ID" "$R2_PREVIEW_ACCESS_KEY_ID" \
              "$R2_PREVIEW_SECRET_ACCESS_KEY" "$R2_PREVIEW_BUCKET" "$R2_PREVIEW_ENDPOINT"; do
              echo "::add-mask::$value"
            done
            printf '%s\n' \
              "R2_ACCOUNT_ID=$R2_PREVIEW_ACCOUNT_ID" \
              "R2_ACCESS_KEY_ID=$R2_PREVIEW_ACCESS_KEY_ID" \
              "R2_SECRET_ACCESS_KEY=$R2_PREVIEW_SECRET_ACCESS_KEY" \
              "R2_BUCKET=$R2_PREVIEW_BUCKET" \
              "R2_ENDPOINT=$R2_PREVIEW_ENDPOINT" > "$r2_args_file"
            echo "PREVIEW_MEDIA=enabled" >> "$GITHUB_ENV"
            echo "Media capability: enabled (dedicated R2 preview bucket detected)." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "PREVIEW_MEDIA=disabled" >> "$GITHUB_ENV"
            echo "Media capability: disabled (not all R2_PREVIEW_* secrets are set — uploads will fail fast, no derivative jobs)." | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Set Fly secrets (branch DATABASE_URL + throwaway keys + optional R2)
        run: |
          set -euo pipefail
          args=(DATABASE_URL="$DATABASE_URL" DATABASE_SSL=true
            JWT_PRIVATE_KEY="$JWT_PRIVATE_KEY" JWT_PUBLIC_KEY="$JWT_PUBLIC_KEY"
            AUTH_CODE_DELIVERY_ACTIVE_KEY_ID="$AUTH_CODE_DELIVERY_ACTIVE_KEY_ID"
            AUTH_CODE_DELIVERY_KEYS="$AUTH_CODE_DELIVERY_KEYS")
          if [ -f "$RUNNER_TEMP/preview-r2-args.txt" ]; then
            while IFS= read -r line; do args+=("$line"); done < "$RUNNER_TEMP/preview-r2-args.txt"
            rm -f "$RUNNER_TEMP/preview-r2-args.txt"
          fi
          flyctl secrets set --app "patches-pr-${PR_NUMBER}" "${args[@]}" >/dev/null

      - name: Generate preview fly config
        run: node infra/preview/make-preview-config.mjs --pr "$PR_NUMBER"

      - name: Build server + worker on the runner (turbo-cached)
        # The same turbo cache the CI jobs restore (setup action) makes unchanged
        # packages FULL TURBO replays; only what this PR changed actually compiles.
        run: pnpm exec turbo run build --filter=@patches/server --filter=@patches/worker

      # Optional web-preview capability, gated on the Cloudflare credentials exactly
      # like the R2 media path: all-or-none. The detect step always runs (it only
      # reads secret/var presence and sets PREVIEW_WEB for the capability matrix);
      # the build/deploy/CORS steps below are additionally guarded by an `if:` so
      # they are skipped entirely — never fail — when the credentials are absent.
      - name: Detect optional web preview capability (Cloudflare Pages)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "PREVIEW_WEB=enabled" >> "$GITHUB_ENV"
            echo "Web preview capability: enabled (Cloudflare API token + account id detected)." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "PREVIEW_WEB=disabled" >> "$GITHUB_ENV"
            echo "Web preview capability: disabled (CLOUDFLARE_API_TOKEN and/or CLOUDFLARE_ACCOUNT_ID not set — apps/web is not previewed)." | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Build web client for preview
        # MUST run before the pnpm-deploy staging below: `pnpm deploy --prod` prunes
        # devDependencies from the workspace's virtual store, which deletes build
        # tools (e.g. @patches/markup's tsup) that `@patches/web...` still needs
        # (observed 2026-08-26: "tsup: not found" when this ran after staging).
        if: env.PREVIEW_WEB == 'enabled'
        run: pnpm --filter @patches/web... build
        env:
          VITE_PATCHES_API_BASE: https://patches-pr-${{ github.event.pull_request.number || inputs.pr_number }}.fly.dev:8443
          GITHUB_SHA: ${{ env.PR_HEAD_SHA || github.event.pull_request.head.sha }}

      - name: Deploy web preview to Cloudflare Pages
        # Also before the pnpm-deploy staging: staging prunes root devDeps too, and
        # wrangler is a root devDependency (observed: "Command wrangler not found").
        id: web_deploy
        if: env.PREVIEW_WEB == 'enabled'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          # `--branch pr-<N>` keeps each PR's deploys on one Pages branch. Capture the
          # live `https://<hash>-patches-web.pages.dev` URL wrangler prints into a step
          # output (tee keeps it visible in the log for debugging).
          web_url="$(pnpm exec wrangler pages deploy apps/web/dist \
            --project-name patches-web \
            --branch "pr-${{ github.event.pull_request.number || inputs.pr_number }}" \
            2>&1 | tee /dev/stderr | grep -oE 'https://[a-zA-Z0-9.-]+\.pages\.dev' | head -n 1)"
          [ -n "$web_url" ] || { echo "wrangler did not print a *.pages.dev URL" >&2; exit 1; }
          echo "web_url=$web_url" >> "$GITHUB_OUTPUT"
          echo "Web preview deployed at $web_url" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Stage self-contained app dirs (pnpm deploy)
        run: |
          set -euo pipefail
          ctx="infra/preview/.image-context"
          rm -rf "$ctx" && mkdir -p "$ctx"
          pnpm --filter @patches/server deploy --prod --legacy "$ctx/server"
          pnpm --filter @patches/worker deploy --prod --legacy "$ctx/worker"
          cp infra/docker/migrate.mjs "$ctx/migrate.mjs"

      - name: Assemble image (COPY-only — no toolchain in CI docker)
        run: >-
          docker build -f infra/docker/Dockerfile.prebuilt
          -t "registry.fly.io/patches-pr-${PR_NUMBER}:pr-${PR_HEAD_SHA:-${{ github.event.pull_request.head.sha }}}"
          --build-arg PATCHES_BUILD_SHA="${PR_HEAD_SHA:-${{ github.event.pull_request.head.sha }}}"
          infra/preview/.image-context

      # Fly's documented CI pattern (fly.io/docs/blueprints/using-the-fly-docker-registry):
      # build with your own caches, push to the app's private registry path, deploy by
      # ref. `flyctl auth docker` honors FLY_API_TOKEN; the per-app registry path is
      # org-scoped so no extra credentials exist to rotate.
      - name: Push image to the Fly registry
        run: |
          set -euo pipefail
          flyctl auth docker
          docker push "registry.fly.io/patches-pr-${PR_NUMBER}:pr-${PR_HEAD_SHA:-${{ github.event.pull_request.head.sha }}}"

      - name: Deploy prebuilt image to Fly
        # Built on the runner from the restored pnpm/turbo caches (Fly's remote
        # builders share none of those, and their cold path measured ~1m50s per
        # deploy). Process groups, checks, and autostop all come from the generated
        # fly config as before.
        run: |
          set -euo pipefail
          flyctl deploy --config "infra/preview/fly-pr-${PR_NUMBER}.toml" \
            --image "registry.fly.io/patches-pr-${PR_NUMBER}:pr-${PR_HEAD_SHA:-${{ github.event.pull_request.head.sha }}}" \
            --ha=false --strategy immediate --yes

      - name: Allow the web preview origin in Connect CORS
        # An empty/unset WEB_ORIGINS denies every cross-origin browser request (see
        # apps/server/src/transport/connect/cors.ts), so the preview web would be
        # blocked until the Pages origin is allow-listed. Set it (as a Fly secret,
        # like the other runtime secrets) to the deterministic branch alias AND the
        # live deployment URL wrangler printed. Setting a secret restarts the machine.
        if: env.PREVIEW_WEB == 'enabled'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          FLY_PREVIEW_ORG: ${{ vars.FLY_PREVIEW_ORG }}
        run: |
          set -euo pipefail
          pr="${{ github.event.pull_request.number || inputs.pr_number }}"
          web_url="${{ steps.web_deploy.outputs.web_url }}"
          branch_alias="https://pr-${pr}.patches-web.pages.dev"
          # The deploy a few steps up just replaced both machines; setting a secret
          # immediately can race "machine is replacing: concurrent update in
          # progress". Retry with backoff instead of failing the preview over it.
          for i in $(seq 1 6); do
            if flyctl secrets set --app "patches-pr-${pr}" \
                 "WEB_ORIGINS=${branch_alias},${web_url}" >/dev/null 2>"$RUNNER_TEMP/cors-err.txt"; then
              echo "WEB_ORIGINS set (attempt ${i})."; exit 0
            fi
            if ! grep -q "concurrent update in progress" "$RUNNER_TEMP/cors-err.txt"; then
              cat "$RUNNER_TEMP/cors-err.txt" >&2; exit 1
            fi
            echo "machines still replacing (attempt ${i}/6); waiting 10s"; sleep 10
          done
          cat "$RUNNER_TEMP/cors-err.txt" >&2; exit 1

      - name: Verify web↔backend connectivity (healthz + CORS preflight)
        # B-154: a partner hit "can't connect to the backend" on a preview web URL.
        # That instance was a merged-PR teardown window (backend gone, Pages orphan —
        # now fixed in teardown), but this probe proves the LIVE path every deploy:
        # the Pages origin must get CORS approval from the Connect edge and healthz
        # must answer, exactly as the browser client's login fetch does.
        if: env.PREVIEW_WEB == 'enabled'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          pr="${{ github.event.pull_request.number || inputs.pr_number }}"
          origin="https://pr-${pr}.patches-web.pages.dev"
          # The HTTP/Connect edge is :8443 — :443 is the gRPC service (spec of
          # infra/preview/fly-preview.toml); healthz lives behind the HTTP one.
          edge="https://patches-pr-${pr}.fly.dev:8443"
          health=""
          # Autostopped server machines take a few seconds to wake on the first
          # request, and a brand-new app's DNS can take a minute — probe with short
          # intervals rather than paying a flat 15s sleep per attempt.
          for i in $(seq 1 20); do
            if health="$(curl -fsS --max-time 10 "${edge}/healthz" 2>/dev/null)"; then break; fi
            echo "healthz not reachable yet (attempt ${i}/20); waiting 5s"; sleep 5
          done
          [ -n "$health" ] || { echo "healthz never became reachable" >&2; exit 1; }
          echo "healthz: ${health}" | head -c 200; echo
          echo "CORS preflight from ${origin}:"
          preflight="$(curl -fsS --max-time 30 -o /dev/null -w '%{http_code}' \
            -X OPTIONS "${edge}/patches.v1.AuthService/Login" \
            -H "Origin: ${origin}" \
            -H 'Access-Control-Request-Method: POST' \
            -H 'Access-Control-Request-Headers: content-type')"
          echo "preflight status: ${preflight}"
          allow="$(curl -fsS --max-time 30 -o /dev/null -w '%{header_json}' \
            -X OPTIONS "${edge}/patches.v1.AuthService/Login" \
            -H "Origin: ${origin}" \
            -H 'Access-Control-Request-Method: POST' \
            -H 'Access-Control-Request-Headers: content-type' \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const h=JSON.parse(s);process.stdout.write((h["access-control-allow-origin"]??[]).join(","))})')"
          echo "access-control-allow-origin: ${allow}"
          case ",${allow}," in *",${origin}"*) ;; *) echo "CORS preflight did not allow the Pages origin" >&2; exit 1 ;; esac
          echo "connectivity OK" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Post preview URL comment on the PR (edit existing)
        env:
          GH_TOKEN: ${{ github.token }}
          APP: patches-pr-${{ github.event.pull_request.number || inputs.pr_number }}
          COMMIT_SHA: ${{ env.PR_HEAD_SHA || github.event.pull_request.head.sha }}
          PREVIEW_MEDIA: ${{ env.PREVIEW_MEDIA }}
          PREVIEW_WEB: ${{ env.PREVIEW_WEB }}
          WEB_PREVIEW_URL: ${{ steps.web_deploy.outputs.web_url }}
        run: |
          set -euo pipefail
          marker="<!-- patches-preview: pr-${PR_NUMBER} -->"
          body_file="$RUNNER_TEMP/preview-comment.md"
          # shellcheck disable=SC2016  # single quotes are intentional: ${...} below are JavaScript template literals, not shell expansions
          node -e '
            const fs = require("node:fs");
            const { PR_NUMBER, APP, COMMIT_SHA, PREVIEW_MEDIA, PREVIEW_WEB, WEB_PREVIEW_URL } = process.env;
            const NEON_BRANCH = `pr-${PR_NUMBER}`;
            const short = (COMMIT_SHA || "").slice(0, 7);
            const media = PREVIEW_MEDIA === "enabled"
              ? "on (dedicated R2 preview bucket — uploads + derivative jobs live)"
              : "off (no R2_PREVIEW_* secrets — uploads fail fast)";
            const webUrl = (WEB_PREVIEW_URL || "").trim();
            const web = PREVIEW_WEB === "enabled" && webUrl
              ? `on — ${webUrl} (Connect API base \`https://${APP}.fly.dev:8443\`)`
              : "off (no CLOUDFLARE_API_TOKEN/CLOUDFLARE_ACCOUNT_ID — backend-only preview)";
            const body = [
              process.argv[1],
              "## Preview environment (full stack)",
              "",
              "| What | Where |",
              "| --- | --- |",
              `| gRPC (TUI: \`patches --server ${APP}.fly.dev:443\`) | \`${APP}.fly.dev:443\` |`,
              `| HTTP / healthz | https://${APP}.fly.dev:8443/healthz |`,
              `| Worker (jobs: notifications, cleanup${PREVIEW_MEDIA === "enabled" ? ", media derivatives" : ""}) | running (\`WORKER_ID=preview-pr-${PR_NUMBER}\`, concurrency 2) |`,
              `| Web preview${webUrl ? ` | ${webUrl} ` : " | — "}(\`pr-${PR_NUMBER}.patches-web.pages.dev\`)`,
              `| Neon branch | \`${NEON_BRANCH}\` |`,
              `| Commit | \`${short}\` |`,
              "",
              "Capability matrix:",
              "",
              "| Capability | State |",
              "| --- | --- |",
              "| gRPC + Connect API + worker + DB branch | live |",
              `| Media / R2 | ${media} |`,
              `| Web frontend (Cloudflare Pages) | ${web} |`,
              "| Federation | off (ephemeral origin — see docs/operations/preview-environments.md) |",
              "| Real email | off (console provider: verification codes are accepted then dropped — **sign in with an existing account** from the cloned data) |",
              "",
              "**Data warning:** the preview database is a Neon branch of production — public content is readable logged-out (`PUBLIC_READ=true`); as on every Patches node, v0 DMs are server-visible (never encrypted/private) to the operator of this node.",
              "",
              "Destroyed automatically when this PR closes.",
            ].join("\n");
            fs.writeFileSync(process.argv[2], body);
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, body + "\n");
          ' "$marker" "$body_file"
          existing_id="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
            --paginate --jq ".[] | select(.body | contains(\"$marker\")) | .id" | head -n 1 || true)"
          if [ -n "$existing_id" ]; then
            echo "Editing existing preview comment $existing_id"
            node -e 'const fs=require("node:fs");process.stdout.write(JSON.stringify({body:fs.readFileSync(process.argv[1],"utf8")}))' "$body_file" \
              | gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/$existing_id" --input - >/dev/null
          else
            node -e 'const fs=require("node:fs");process.stdout.write(JSON.stringify({body:fs.readFileSync(process.argv[1],"utf8")}))' "$body_file" \
              | gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" --input - >/dev/null
          fi
          rm -f "$body_file"

  teardown:
    name: teardown (destroy Fly app + Neon branch + Pages preview)
    # Runs automatically when the PR closes (merged or not) and manually via
    # workflow_dispatch action=teardown — which works for closed PRs too; that is
    # the documented orphan-recovery path. Fork/bot closes are skipped: no secrets
    # means no stack was ever deployed (see the header note).
    if: >-
      (github.event_name == 'pull_request' && github.event.action == 'closed' &&
       github.event.pull_request.head.repo.fork == false &&
       github.event.pull_request.user.type != 'Bot') ||
      (github.event_name == 'workflow_dispatch' && inputs.action == 'teardown')
    runs-on: ubuntu-latest
    concurrency:
      # The SAME per-PR group as the deploy job (B-204). Entering teardown cancels
      # any in-flight or pending deploy for this PR — deploying to a closed PR is
      # pointless, and racing one re-orphans the stack. Symmetrically, an incoming
      # deploy (reopened PR, dispatch) cancels a running teardown, which is safe
      # because every teardown step is idempotent.
      group: preview-stack-${{ github.event.pull_request.number || inputs.pr_number }}
      cancel-in-progress: true
    env:
      PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - name: Install Neon CLI
        run: |
          npm install -g neon@3.6.0
          echo "$(npm prefix -g)/bin" >> "$GITHUB_PATH"

      - name: Set up flyctl
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # v1.6

      - uses: actions/checkout@v7

      - uses: pnpm/setup@v2
        with:
          runtime: node@24.19.0

      # Best-effort per resource, honest in aggregate (B-204, fixing B-154's silent
      # swallow): each step records an `outcome` output (destroyed/deleted |
      # already-gone | skipped-no-credentials | error) and never aborts its siblings
      # — one missing resource must not hide the others. The verdict step below
      # fails the job iff any outcome is a real error. Existence is probed via
      # structured JSON (apps list / branches list) rather than scraping CLI error
      # text, so "already gone" never depends on error wording (B-173 philosophy).
      # A PR closed before the first successful deploy simply reports already-gone
      # three times and stays green.
      - name: Destroy Fly app (patches-pr-<N>)
        id: fly_destroy
        continue-on-error: true
        run: |
          set -euo pipefail
          app="patches-pr-${PR_NUMBER}"
          listed="$(flyctl apps list --json)" || {
            echo "outcome=error" >> "$GITHUB_OUTPUT"
            echo "flyctl apps list failed — cannot tell whether ${app} exists" >&2
            exit 0
          }
          probe="$(printf '%s' "$listed" | node -e '
            let s = "";
            process.stdin.on("data", (d) => (s += d)).on("end", () => {
              const name = process.argv[1];
              let apps;
              try {
                apps = JSON.parse(s);
              } catch (err) {
                process.stderr.write("flyctl apps list emitted invalid JSON: " + String(err) + "\n");
                process.exit(1);
              }
              if (!Array.isArray(apps)) {
                process.stderr.write("flyctl apps list JSON was not an array: " + s.slice(0, 200) + "\n");
                process.exit(1);
              }
              process.stdout.write(apps.some((a) => a && typeof a === "object" && (a.Name === name || a.ID === name)) ? "present" : "absent");
            });
          ' "$app")"
          if [ "$probe" = "present" ]; then
            if flyctl apps destroy "$app" --yes; then
              echo "outcome=destroyed" >> "$GITHUB_OUTPUT"
            else
              echo "outcome=error" >> "$GITHUB_OUTPUT"
              echo "flyctl apps destroy ${app} failed" >&2
              exit 0
            fi
          else
            echo "Fly app ${app} not found — nothing to destroy."
            echo "outcome=already-gone" >> "$GITHUB_OUTPUT"
          fi

      - name: Delete Neon branch (pr-<N>)
        id: neon_delete
        continue-on-error: true
        run: |
          set -euo pipefail
          branch="pr-${PR_NUMBER}"
          listed="$(neon branches list --project-id "$NEON_PROJECT_ID" --output json --no-color)" || {
            echo "outcome=error" >> "$GITHUB_OUTPUT"
            echo "neon branches list failed — cannot tell whether branch ${branch} exists" >&2
            exit 0
          }
          probe="$(printf '%s' "$listed" | node -e '
            let s = "";
            process.stdin.on("data", (d) => (s += d)).on("end", () => {
              const name = process.argv[1];
              let doc;
              try {
                doc = JSON.parse(s);
              } catch (err) {
                process.stderr.write("neon branches list emitted invalid JSON: " + String(err) + "\n");
                process.exit(1);
              }
              const branches = Array.isArray(doc) ? doc : doc && Array.isArray(doc.branches) ? doc.branches : null;
              if (branches === null) {
                process.stderr.write("neon branches list JSON had neither array nor branches[] shape: " + s.slice(0, 200) + "\n");
                process.exit(1);
              }
              process.stdout.write(branches.some((b) => b && typeof b === "object" && (b.name === name || (b.branch && typeof b.branch === "object" && b.branch.name === name))) ? "present" : "absent");
            });
          ' "$branch")"
          if [ "$probe" = "present" ]; then
            if neon branches delete "$branch" --project-id "$NEON_PROJECT_ID" --output json --no-color >/dev/null; then
              echo "outcome=deleted" >> "$GITHUB_OUTPUT"
            else
              echo "outcome=error" >> "$GITHUB_OUTPUT"
              echo "neon branches delete ${branch} failed" >&2
              exit 0
            fi
          else
            echo "Neon branch ${branch} not found — nothing to delete."
            echo "outcome=already-gone" >> "$GITHUB_OUTPUT"
          fi

      # The Pages sweep keeps B-173's structured wrangler parsing inside
      # preview-sweep.mjs untouched: malformed wrangler output fails the script,
      # which lands here as outcome=error (red run), never as a silent zero-row
      # sweep. Zero deployments on the branch is the script's own "nothing to
      # clean" success — mapped to already-gone below.
      - name: Delete Cloudflare Pages deployments (pr-<N>)
        id: pages_delete
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "Cloudflare credentials absent — the web-preview capability is off, so this workflow never published Pages deployments for pr-${PR_NUMBER}."
            echo "outcome=skipped-no-credentials" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          log="$RUNNER_TEMP/pages-sweep.log"
          if pnpm install --frozen-lockfile --silent && node infra/preview/preview-sweep.mjs --pr "$PR_NUMBER" | tee "$log"; then
            if grep -q '^done: 0 deployment' "$log"; then
              echo "outcome=already-gone" >> "$GITHUB_OUTPUT"
            else
              echo "outcome=deleted" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "outcome=error" >> "$GITHUB_OUTPUT"
            echo "Pages sweep for pr-${PR_NUMBER} failed" >&2
            exit 0
          fi

      - name: Teardown verdict and summary
        if: always()
        env:
          FLY_OUTCOME: ${{ steps.fly_destroy.outputs.outcome }}
          NEON_OUTCOME: ${{ steps.neon_delete.outputs.outcome }}
          PAGES_OUTCOME: ${{ steps.pages_delete.outputs.outcome }}
        run: |
          set -euo pipefail
          describe() {
            case "$1" in
              destroyed) printf 'destroyed' ;;
              deleted) printf 'deleted' ;;
              already-gone) printf 'already gone (nothing to delete) — ok' ;;
              skipped-no-credentials) printf 'skipped (Cloudflare credentials not configured)' ;;
              *) printf 'ERROR (see the step above)' ;;
            esac
          }
          {
            echo "## Preview teardown (PR #${PR_NUMBER})"
            echo "- Fly app \`patches-pr-${PR_NUMBER}\`: $(describe "${FLY_OUTCOME:-missing}")"
            echo "- Neon branch \`pr-${PR_NUMBER}\`: $(describe "${NEON_OUTCOME:-missing}")"
            echo "- Cloudflare Pages deployments \`pr-${PR_NUMBER}\`: $(describe "${PAGES_OUTCOME:-missing}")"
            echo "- Teardown is idempotent: a re-run (dispatch action=teardown) treats already-gone as success. The Neon branch's 7-day expiry remains the backstop for lost close events; manual teardown is documented in docs/operations/preview-environments.md."
          } >> "$GITHUB_STEP_SUMMARY"
          errors=0
          for outcome in "$FLY_OUTCOME" "$NEON_OUTCOME" "$PAGES_OUTCOME"; do
            case "$outcome" in
              destroyed | deleted | already-gone | skipped-no-credentials) ;;
              *)
                errors=1
                echo "teardown resource reported outcome '${outcome:-<none>}'; failing this job so the failure stays visible" >&2
                ;;
            esac
          done
          exit "$errors"
