# Per-PR temporary FULL-STACK preview environments (B-105): one Fly app (server +
# worker process groups, one machine each) + one Neon branch per pull request
# targeting a mainline branch (main, swarm/e2ee-federation-niceties).
#
# deploy job   (opened/synchronize/reopened): create-or-reuse Neon branch `pr-<N>`,
#              run migrations against it, deploy app `patches-pr-<N>` with BOTH
#              processes (federation off, console email, PUBLIC_READ=true; media
#              on iff all R2_PREVIEW_* secrets exist — see capability detection
#              below), then post/update a `<!-- patches-preview -->` PR comment
#              carrying the capability matrix.
# teardown job (closed): destroy the Fly app and delete the Neon branch, best-effort.
#
# Required secrets (repository or `preview` environment — Settings → Secrets):
#   FLY_API_TOKEN      flyctl token allowed to create/destroy apps in the target org
#                      (org-scoped: `fly tokens org <org>` — Fly's review-apps
#                      blueprint's recommendation)
#   NEON_API_KEY       Neon API key for the preview project (project-scoped org key
#                      if the account supports it — docs/research/neon-branching.md)
#   NEON_PROJECT_ID    Neon project id previews branch from (e.g. shy-recipe-96135980)
# Optional secrets (media capability — set ALL FIVE or none):
#   R2_PREVIEW_ACCOUNT_ID / R2_PREVIEW_ACCESS_KEY_ID / R2_PREVIEW_SECRET_ACCESS_KEY /
#   R2_PREVIEW_BUCKET / R2_PREVIEW_ENDPOINT
#                      scoped to a dedicated PREVIEW R2 bucket, never the production
#                      one. When all five are present the workflow sets the app's
#                      R2_* secrets and media (uploads + worker derivative jobs) is
#                      live; when any is missing, media degrades cleanly (R2_* are
#                      optional in packages/config's storageEnvSchema and the media
#                      module errors at call time, not boot time).
#   NEON_BRANCH_PASSWORD  Not read by this workflow: the branch role password comes
#                      from `neon connection-string` (the Neon API hands the CLI the
#                      password; verified in the CLI source). Keep this secret only
#                      if you want the documented manual-psql fallback in
#                      docs/operations/preview-environments.md to work.
# Optional repository variables:
#   NEON_PREVIEW_PARENT_BRANCH  branch name/id to parent previews on. UNSET = the
#                      project's default branch (production!) — see the data warning
#                      in the runbook before relying on that default.
#   FLY_PREVIEW_ORG    Fly org for preview apps (default: personal)
#
# Fork PRs are skipped by the deploy job's `if:` — GitHub never exposes these
# secrets to `pull_request` runs from forks, so a deploy there can only fail.
# Nothing here touches mainline (`main`, `swarm/e2ee-federation-niceties`) deploys.

name: Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main, swarm/e2ee-federation-niceties]
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to (re)deploy a preview for (must be open)
        required: true
        type: number

permissions:
  contents: read
  pull-requests: write

jobs:
  deploy:
    name: deploy (Fly preview + Neon branch)
    # pull_request: skip forks (no secrets) and the closed event (teardown's job).
    # workflow_dispatch: always allowed; the resolve step below fails fast on a
    # missing or closed PR.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.action != 'closed' && github.event.pull_request.head.repo.fork == false)
    runs-on: ubuntu-latest
    concurrency:
      # One in-flight deploy per PR; a new push cancels the superseded deploy.
      group: preview-deploy-${{ github.event.pull_request.number || inputs.pr_number }}
      cancel-in-progress: true
    env:
      PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      # Runs before checkout on purpose: dispatch needs the PR's head sha, and gh is
      # preinstalled on the runner. Also the only place that validates a dispatch's
      # PR number (exists + open) — everything downstream can then assume it.
      - name: Resolve PR head commit (workflow_dispatch)
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          state="$(gh pr view "$PR_NUMBER" --json state,headRefOid --jq '.state + " " + .headRefOid')" || {
            echo "PR #$PR_NUMBER not found." >&2; exit 1; }
          pr_state="${state%% *}"
          [ "$pr_state" = "OPEN" ] || { echo "PR #$PR_NUMBER is $pr_state; refusing to deploy a preview for it." >&2; exit 1; }
          echo "PR_HEAD_SHA=${state##* }" >> "$GITHUB_ENV"

      - uses: actions/checkout@v7
        with:
          # The exact PR head commit — on dispatch github.sha is the default branch.
          ref: ${{ env.PR_HEAD_SHA || github.event.pull_request.head.sha }}

      - uses: ./.github/actions/setup

      # Same CLI major/minor as the mise.toml pin (npm package `neon` ships only the
      # `neon` bin — `neonctl` is the legacy Homebrew package name).
      - name: Install Neon CLI
        run: npm install -g neon@3.6.0

      - name: Set up flyctl
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # v1.6

      - name: Create or reuse Neon branch (pr-<N>)
        run: |
          set -euo pipefail
          branch="pr-${PR_NUMBER}"
          # 7-day hard expiry is the fail-safe for cancelled runs / lost events;
          # a re-deploy (synchronize) pushes it out again. Explicit teardown on PR
          # close remains the normal cleanup path.
          expires="$(date -u -d '+7 days' +%Y-%m-%dT%H:%M:%SZ)"
          if neon branches get "$branch" --project-id "$NEON_PROJECT_ID" --output json --no-color >/dev/null 2>&1; then
            echo "Reusing existing Neon branch $branch (expiry bumped to $expires)."
            neon branches set-expiration "$branch" --project-id "$NEON_PROJECT_ID" --expires-at "$expires" >/dev/null
          else
            # No --parent unless configured: Neon defaults the parent to the
            # project's default branch. vars.NEON_PREVIEW_PARENT_BRANCH overrides
            # (e.g. an anonymized mirror) — see the runbook's data warning.
            args=(--project-id "$NEON_PROJECT_ID" --name "$branch" --expires-at "$expires" --suspend-timeout 300 --output json --no-color)
            if [ -n "${NEON_PREVIEW_PARENT_BRANCH:-}" ]; then
              args+=(--parent "$NEON_PREVIEW_PARENT_BRANCH")
            fi
            echo "Creating Neon branch $branch (expires $expires)."
            neon branches create "${args[@]}" >/dev/null
          fi

      - name: Fetch branch connection string
        run: |
          set -euo pipefail
          # `neon connection-string` embeds the branch role's password (fetched from
          # the Neon API), so this value is a secret: mask it before it can hit any
          # log, and keep it in GITHUB_ENV only.
          url="$(neon connection-string "pr-${PR_NUMBER}" \
            --project-id "$NEON_PROJECT_ID" \
            --database-name neondb --role-name neondb_owner --no-color \
            | sed 's/&channel_binding=require//')"
          [ -n "$url" ] || { echo "Neon returned an empty connection string" >&2; exit 1; }
          echo "::add-mask::$url"
          echo "DATABASE_URL=$url" >> "$GITHUB_ENV"

      - name: Run migrations against the Neon branch
        run: pnpm db:migrate
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          DATABASE_SSL: 'true'

      # Per-PR throwaway keys (rotated on every deploy — existing preview sessions
      # are invalidated by each push, which is fine for a preview). No shared
      # production secrets ever reach a preview app.
      - name: Generate throwaway JWT + auth-code keys
        run: |
          set -euo pipefail
          pnpm keys:generate > "$RUNNER_TEMP/preview-keys.env"
          for name in JWT_PRIVATE_KEY JWT_PUBLIC_KEY AUTH_CODE_DELIVERY_ACTIVE_KEY_ID AUTH_CODE_DELIVERY_KEYS; do
            value="$(sed -n "s/^${name}=//p" "$RUNNER_TEMP/preview-keys.env")"
            [ -n "$value" ] || { echo "keys:generate output is missing $name" >&2; exit 1; }
            echo "::add-mask::$value"
            echo "$name=$value" >> "$GITHUB_ENV"
          done
          rm -f "$RUNNER_TEMP/preview-keys.env"

      - name: Create Fly app if needed (patches-pr-<N>)
        run: |
          set -euo pipefail
          org="${FLY_PREVIEW_ORG:-personal}"
          # Idempotent: `apps create` fails when the name is taken (every re-deploy).
          # Any other failure (bad token, quota) surfaces in the deploy step below.
          flyctl apps create "patches-pr-${PR_NUMBER}" --org "$org" >/dev/null 2>&1 \
            || echo "Fly app patches-pr-${PR_NUMBER} already exists (or create was refused) — continuing."
        env:
          FLY_PREVIEW_ORG: ${{ vars.FLY_PREVIEW_ORG }}

      # Capability detection (documented matrix, never a silent failure): the ONLY
      # optional capability is media, gated on the five R2_PREVIEW_* secrets being
      # ALL present (all-or-none — partial config would half-work). Presence is
      # checked via env mapping since `gh secret list` is unavailable to the
      # workflow itself. Missing → media cleanly degraded (upload/derivative paths
      # error at call time by design in packages/config's storageEnvSchema), and
      # the PR comment says so.
      - name: Detect optional media capability (R2 preview bucket)
        env:
          R2_PREVIEW_ACCOUNT_ID: ${{ secrets.R2_PREVIEW_ACCOUNT_ID }}
          R2_PREVIEW_ACCESS_KEY_ID: ${{ secrets.R2_PREVIEW_ACCESS_KEY_ID }}
          R2_PREVIEW_SECRET_ACCESS_KEY: ${{ secrets.R2_PREVIEW_SECRET_ACCESS_KEY }}
          R2_PREVIEW_BUCKET: ${{ secrets.R2_PREVIEW_BUCKET }}
          R2_PREVIEW_ENDPOINT: ${{ secrets.R2_PREVIEW_ENDPOINT }}
        run: |
          set -euo pipefail
          r2_args_file="$RUNNER_TEMP/preview-r2-args.txt"
          if [ -n "$R2_PREVIEW_ACCOUNT_ID" ] && [ -n "$R2_PREVIEW_ACCESS_KEY_ID" ] && \
             [ -n "$R2_PREVIEW_SECRET_ACCESS_KEY" ] && [ -n "$R2_PREVIEW_BUCKET" ] && \
             [ -n "$R2_PREVIEW_ENDPOINT" ]; then
            for value in "$R2_PREVIEW_ACCOUNT_ID" "$R2_PREVIEW_ACCESS_KEY_ID" \
              "$R2_PREVIEW_SECRET_ACCESS_KEY" "$R2_PREVIEW_BUCKET" "$R2_PREVIEW_ENDPOINT"; do
              echo "::add-mask::$value"
            done
            printf '%s\n' \
              "R2_ACCOUNT_ID=$R2_PREVIEW_ACCOUNT_ID" \
              "R2_ACCESS_KEY_ID=$R2_PREVIEW_ACCESS_KEY_ID" \
              "R2_SECRET_ACCESS_KEY=$R2_PREVIEW_SECRET_ACCESS_KEY" \
              "R2_BUCKET=$R2_PREVIEW_BUCKET" \
              "R2_ENDPOINT=$R2_PREVIEW_ENDPOINT" > "$r2_args_file"
            echo "PREVIEW_MEDIA=enabled" >> "$GITHUB_ENV"
            echo "Media capability: enabled (dedicated R2 preview bucket detected)." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "PREVIEW_MEDIA=disabled" >> "$GITHUB_ENV"
            echo "Media capability: disabled (not all R2_PREVIEW_* secrets are set — uploads will fail fast, no derivative jobs)." | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Set Fly secrets (branch DATABASE_URL + throwaway keys + optional R2)
        run: |
          set -euo pipefail
          args=(DATABASE_URL="$DATABASE_URL" DATABASE_SSL=true
            JWT_PRIVATE_KEY="$JWT_PRIVATE_KEY" JWT_PUBLIC_KEY="$JWT_PUBLIC_KEY"
            AUTH_CODE_DELIVERY_ACTIVE_KEY_ID="$AUTH_CODE_DELIVERY_ACTIVE_KEY_ID"
            AUTH_CODE_DELIVERY_KEYS="$AUTH_CODE_DELIVERY_KEYS")
          if [ -f "$RUNNER_TEMP/preview-r2-args.txt" ]; then
            while IFS= read -r line; do args+=("$line"); done < "$RUNNER_TEMP/preview-r2-args.txt"
            rm -f "$RUNNER_TEMP/preview-r2-args.txt"
          fi
          flyctl secrets set --app "patches-pr-${PR_NUMBER}" "${args[@]}" >/dev/null

      - name: Generate preview fly config
        run: node infra/preview/make-preview-config.mjs --pr "$PR_NUMBER"

      - name: Deploy to Fly
        run: |
          set -euo pipefail
          # --ha=false: exactly one machine per process group (cost guard — two
          # total: server + worker). --strategy immediate: replace them in place
          # rather than briefly running doubles.
          flyctl deploy --config "infra/preview/fly-pr-${PR_NUMBER}.toml" \
            --remote-only --ha=false --strategy immediate --yes \
            --build-arg PATCHES_BUILD_SHA="${PR_HEAD_SHA:-${{ github.event.pull_request.head.sha }}}"

      - name: Post preview URL comment on the PR (edit existing)
        env:
          GH_TOKEN: ${{ github.token }}
          APP: patches-pr-${{ github.event.pull_request.number || inputs.pr_number }}
          COMMIT_SHA: ${{ env.PR_HEAD_SHA || github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          marker="<!-- patches-preview: pr-${PR_NUMBER} -->"
          body_file="$RUNNER_TEMP/preview-comment.md"
          node -e '
            const fs = require("node:fs");
            const { PR_NUMBER, APP, COMMIT_SHA, PREVIEW_MEDIA } = process.env;
            const NEON_BRANCH = `pr-${PR_NUMBER}`;
            const short = (COMMIT_SHA || "").slice(0, 7);
            const media = PREVIEW_MEDIA === "enabled"
              ? "on (dedicated R2 preview bucket — uploads + derivative jobs live)"
              : "off (no R2_PREVIEW_* secrets — uploads fail fast)";
            const body = [
              process.argv[1],
              "## Preview environment (full stack)",
              "",
              "| What | Where |",
              "| --- | --- |",
              `| gRPC (TUI: \`patches --server ${APP}.fly.dev:443\`) | \`${APP}.fly.dev:443\` |`,
              `| HTTP / healthz | https://${APP}.fly.dev/healthz |`,
              `| Worker (jobs: notifications, cleanup${PREVIEW_MEDIA === "enabled" ? ", media derivatives" : ""}) | running (\`WORKER_ID=preview-pr-${PR_NUMBER}\`, concurrency 2) |`,
              `| Neon branch | \`${NEON_BRANCH}\` |`,
              `| Commit | \`${short}\` |`,
              "",
              "Capability matrix:",
              "",
              "| Capability | State |",
              "| --- | --- |",
              "| gRPC + Connect API + worker + DB branch | live |",
              `| Media / R2 | ${media} |`,
              "| Federation | off (ephemeral origin — see docs/operations/preview-environments.md) |",
              "| Real email | off (console provider: verification codes are accepted then dropped — **sign in with an existing account** from the cloned data) |",
              "",
              "**Data warning:** the preview database is a Neon branch of production — public content is readable logged-out (`PUBLIC_READ=true`), and DMs are server-visible like on any Patches node.",
              "",
              "Destroyed automatically when this PR closes.",
            ].join("\n");
            fs.writeFileSync(process.argv[2], body);
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, body + "\n");
          ' "$marker" "$body_file"
          existing_id="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
            --paginate --jq ".[] | select(.body | contains(\"$marker\")) | .id" | head -n 1 || true)"
          if [ -n "$existing_id" ]; then
            echo "Editing existing preview comment $existing_id"
            node -e 'const fs=require("node:fs");process.stdout.write(JSON.stringify({body:fs.readFileSync(process.argv[1],"utf8")}))' "$body_file" \
              | gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/$existing_id" --input - >/dev/null
          else
            node -e 'const fs=require("node:fs");process.stdout.write(JSON.stringify({body:fs.readFileSync(process.argv[1],"utf8")}))' "$body_file" \
              | gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" --input - >/dev/null
          fi
          rm -f "$body_file"

  teardown:
    name: teardown (destroy Fly app + Neon branch)
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    concurrency:
      group: preview-teardown-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - name: Install Neon CLI
        run: npm install -g neon@3.6.0

      - name: Set up flyctl
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # v1.6

      # Both steps are best-effort on purpose: a PR closed before the first
      # successful deploy (or from a fork, where secrets are unavailable) has
      # nothing to destroy, and that must not fail this job.
      - name: Destroy Fly app (patches-pr-<N>)
        id: fly_destroy
        continue-on-error: true
        run: flyctl apps destroy "patches-pr-${PR_NUMBER}" --yes

      - name: Delete Neon branch (pr-<N>)
        id: neon_delete
        continue-on-error: true
        run: neon branches delete "pr-${PR_NUMBER}" --project-id "$NEON_PROJECT_ID" --output json --no-color >/dev/null

      - name: Teardown summary
        if: always()
        run: |
          set -euo pipefail
          {
            echo "## Preview teardown (PR #${PR_NUMBER})"
            echo "- Fly app \`patches-pr-${PR_NUMBER}\`: ${FLY_RESULT}"
            echo "- Neon branch \`pr-${PR_NUMBER}\`: ${NEON_RESULT}"
            echo "- If either failed, the Neon branch's 7-day expiry is the fail-safe; see manual teardown in docs/operations/preview-environments.md."
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          FLY_RESULT: ${{ steps.fly_destroy.outcome == 'success' && 'destroyed' || 'FAILED (or nothing to destroy)' }}
          NEON_RESULT: ${{ steps.neon_delete.outcome == 'success' && 'deleted' || 'FAILED (or nothing to delete)' }}
