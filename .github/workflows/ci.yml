name: CI

on:
  pull_request:
  push:
    branches: [main]
  # `ci-ok` is a required status check on `main`. Event delivery for `pull_request`/`push`
  # can stall (seen 2026-08-26 — new commits produced no runs at all for ~50 minutes), and a
  # required check that can't be triggered is a merge deadlock. `workflow_dispatch` lets CI
  # be run by hand against a PR's head branch: check runs attach to the head commit sha, so
  # a manual run still satisfies branch protection for that PR. Matches web.yml's
  # `workflow_dispatch` under B-198 for the same reason.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Only cancel in-flight runs for PRs (superseded by a newer push to the same branch).
  # A push to `main` must always run to completion — cancelling it would leave `main`'s
  # last commit without a completed status check. `workflow_dispatch` shares this same
  # group (github.ref is the dispatched branch's refs/heads/<branch>, identical to what a
  # push to that branch would use) but never sets cancel-in-progress (github.event_name is
  # 'workflow_dispatch', not 'pull_request'), so a manual run against `main` queues behind
  # an in-flight push run rather than cancelling it, and vice versa. A manual run against a
  # PR's head branch lands in its own group anyway, since `pull_request` runs use the
  # synthetic `refs/pull/<n>/merge` ref, not `refs/heads/<branch>`.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: quality (format, lint, typecheck)
    runs-on: ubuntu-latest
    steps:
      # actions/checkout must run before a local composite action (`./...`) can be
      # resolved — it doesn't exist on the runner until the repo is checked out.
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck

  proto:
    name: proto (buf + generated code freshness)
    runs-on: ubuntu-latest
    steps:
      # buf breaking needs `main`'s history available to diff against.
      - uses: actions/checkout@v7
        with:
          fetch-depth: '0'
      - uses: ./.github/actions/setup

      - name: Fetch main (buf breaking diff target)
        if: github.event_name == 'pull_request'
        run: git fetch origin main:main

      - run: pnpm proto:format
      - run: pnpm proto:lint

      # Skipped on push to main: there is no meaningful "main vs main" diff, and this
      # is also the point at which a deliberate breaking change (reviewed on its PR)
      # is expected to land. packages/proto/scripts/breaking.sh resolves the ref
      # (`../../.git#branch=main,subdir=packages/proto`) itself.
      - name: buf breaking (against main)
        if: github.event_name == 'pull_request'
        run: pnpm proto:breaking

      - name: Generate protobuf TypeScript
        run: pnpm proto:gen

      - name: Fail if generated code is stale or wasn't committed
        run: git diff --exit-code -- packages/proto/src/generated

  build-test:
    name: build-test (build + unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm build

      # B-176: `pnpm build` (turbo) already builds @patches/web as one of its packages, so
      # these gate the exact dist a merge to main would later publish — at PR time instead
      # of only in web.yml's post-merge deploy job, where a budget-busting or dev-mode PR
      # was previously only caught after landing on main. VITE_PATCHES_API_BASE isn't set
      # here (this job never deploys), which doesn't affect either check: bundle:check only
      # measures chunk sizes, and dist:check's markers (jsxDEV, absolute build paths) are a
      # property of build mode, not the API base.
      - name: Check web bundle size budget
        run: pnpm --filter @patches/web run bundle:check

      - name: Check web dist is a clean production build
        run: pnpm --filter @patches/web run dist:check

      - run: pnpm test

      # Coverage floor for the security-critical package. Runs vitest directly —
      # outside turbo — so it executes on every push rather than being replayed
      # from cache. Floors sit ~3-6pts under the 2026-08-25 measurement (lines
      # 90.25 / branches 76.01 / statements 88.29): they catch regressions, not
      # noise. (Vitest 4 has no per-project coverage config — hence CLI flags.)
      - name: Enforce crypto coverage thresholds
        run: >-
          pnpm --filter @patches/crypto exec vitest run --coverage
          --coverage.thresholds.lines=85
          --coverage.thresholds.branches=70
          --coverage.thresholds.statements=85

      # Optional: only uploads whatever coverage output the vitest projects already
      # produce on their own (no coverage flag is forced here — not every project is
      # guaranteed to have a coverage provider configured yet). Never fails the job.
      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: '**/coverage/**'
          if-no-files-found: ignore
          retention-days: 14

  integration:
    name: integration (Postgres + migrations)
    # Runs after build-test (same `pnpm build`, same inputs) rather than racing it in
    # parallel, and explicitly shares its turbo cache scope (setup's `cache-scope`
    # input) instead of using its own: build-test's cache is guaranteed already saved
    # by the time this job's `Restore turbo cache` step runs, so `pnpm build` below
    # gets a real cache hit here instead of a second full cold rebuild.
    needs: build-test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: patches
          POSTGRES_PASSWORD: patches
          POSTGRES_DB: patches_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U patches -d patches_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Migration validation reads `DATABASE_URL`/`TEST_DATABASE_URL`, both pointed at the
      # single `patches_test` database the `services:` postgres container provisions on
      # boot — see docs/operations/ci.md ("Why one database"). Every DB-backed vitest
      # project now has its own database (`server-integration`, `worker-integration`,
      # `admin-integration`, `testkit` as of B-012), so `test:integration` no longer needs
      # `--no-file-parallelism` purely for cross-project database isolation — it's kept anyway; see
      # docs/operations/ci.md for why. Migration validation runs first (before
      # `test:integration`) so the schema is in place by the time tests connect.
      DATABASE_URL: postgres://patches:patches@localhost:5432/patches_test
      TEST_DATABASE_URL: postgres://patches:patches@localhost:5432/patches_test
      TEST_DATABASE_URL_SERVER: postgres://patches:patches@localhost:5432/patches_test_server
      TEST_DATABASE_URL_WORKER: postgres://patches:patches@localhost:5432/patches_test_worker
      TEST_DATABASE_URL_ADMIN: postgres://patches:patches@localhost:5432/patches_test_admin
      TEST_DATABASE_URL_TESTKIT: postgres://patches:patches@localhost:5432/patches_testkit_test
      # Node B's database for the P8-008 two-node federation integration test — node A reuses
      # TEST_DATABASE_URL_SERVER like every other server-integration test.
      TEST_DATABASE_URL_FED_B: postgres://patches:patches@localhost:5432/patches_test_fed_b
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          cache-scope: build-test
      - run: pnpm build

      - name: Create per-project test databases
        env:
          PGPASSWORD: patches
        # The `services:` postgres container only provisions POSTGRES_DB (patches_test)
        # on boot. `server-integration`, `worker-integration`, `admin-integration`, and
        # `testkit` each get their own database so a dropDatabase() in one project can
        # never race a concurrent test file in another. See docs/operations/ci.md
        # ("Why one database"). Named
        # `patches_testkit_test` (suffix, not `patches_test_testkit` infix) — see the doc
        # comment in packages/testkit/vitest.config.ts for why the suffix is required.
        run: |
          psql -h localhost -U patches -d patches_test -c "CREATE DATABASE patches_test_server OWNER patches;"
          psql -h localhost -U patches -d patches_test -c "CREATE DATABASE patches_test_worker OWNER patches;"
          psql -h localhost -U patches -d patches_test -c "CREATE DATABASE patches_test_admin OWNER patches;"
          psql -h localhost -U patches -d patches_test -c "CREATE DATABASE patches_testkit_test OWNER patches;"
          psql -h localhost -U patches -d patches_test -c "CREATE DATABASE patches_test_fed_b OWNER patches;"

      - name: Run migrations
        run: pnpm db:migrate

      - name: Show migration status (informational)
        run: pnpm db:show

      # ASSUMPTION (documented, see docs/operations/ci.md): TypeORM 1.x's
      # `migration:run` exits 0 and logs "no migrations pending" when there is
      # nothing left to apply, rather than erroring. Running it a second time
      # immediately after the first is therefore the assertion that 0 migrations
      # are pending — more robust than string-matching `db:show`'s output, whose
      # exact format packages/database hasn't defined yet.
      - name: Assert no pending migrations (second run must be a no-op)
        run: pnpm db:migrate

      # The revert gate proves the last migration's `down()` works. One sanctioned
      # exception: a migration may declare itself IRREVERSIBLE BY DESIGN (ADR 0033 §5's
      # clean break — the deleted rows were signed under an encoding nothing can produce
      # anymore, so there is nothing to restore them to). Such a migration's `down()`
      # throws with the literal marker "irreversible by design"; that exact failure (and
      # only that failure — any other revert error still fails this job) satisfies the
      # gate. Nothing was reverted in that case, so the re-apply step below is skipped.
      - name: Revert last migration (prove down works)
        id: revert
        run: |
          set +e
          output=$(pnpm db:revert 2>&1)
          status=$?
          set -e
          echo "$output"
          if [ "$status" -ne 0 ]; then
            if echo "$output" | grep -q "irreversible by design"; then
              echo "deliberately_irreversible=true" >> "$GITHUB_OUTPUT"
            else
              exit 1
            fi
          fi

      - name: Re-apply migration (prove up works again)
        if: steps.revert.outputs.deliberately_irreversible != 'true'
        run: pnpm db:migrate

      - run: pnpm test:integration

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          version: 2026.8.1
          install: true
          cache: true
        env:
          # Only need the actionlint binary here — no workspace install, no Node/pnpm.
          MISE_DISABLE_TOOLS: node,pnpm,docker-compose
      - run: actionlint .github/workflows/*.yml

  ci-ok:
    name: ci-ok
    if: always()
    needs: [quality, proto, build-test, integration, actionlint]
    runs-on: ubuntu-latest
    steps:
      - name: Require all jobs to have succeeded
        run: |
          echo "${{ toJSON(needs) }}"
          if [ "${{ contains(needs.*.result, 'failure') }}" = "true" ] || \
             [ "${{ contains(needs.*.result, 'cancelled') }}" = "true" ] || \
             [ "${{ contains(needs.*.result, 'skipped') }}" = "true" ]; then
            echo "One or more required jobs did not succeed." >&2
            exit 1
          fi
