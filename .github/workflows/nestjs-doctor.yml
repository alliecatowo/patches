# NestJS Doctor — deterministic (non-AI) NestJS code review on PRs (nestjs.doctor).
#
# Single root-level scan: nestjs-doctor auto-detects the pnpm workspace and scans
# every Nest sub-project (apps/server + apps/worker; per-app
# nestjs-doctor.config.json still applies), producing ONE combined score and one
# scope line. (The previous two-job layout made each job print its own fraction
# against the PR-wide file total — "5 of 59" — which read like files were skipped
# when the other job owned them.)
#
# What it does per PR: sticky summary comment with a health score, inline review
# comments on changed lines, and a commit status. `scope: changed` (the action's
# default) means ONLY findings the PR introduces are reported. Non-PR events
# (push to main) force scope:full and always exit 0.
#
# Deliberately NOT gating yet: blocking:none + no min-score (comment/score only).
# Flip to `blocking: error` once a few PRs have landed with sane comments — a
# deliberate follow-up, not a drive-by.
#
# Dependabot/bot PRs: the action needs only github.token (no third-party secret),
# so it runs fine there (unlike the Fly preview workflow, which bots skip).
name: nestjs-doctor

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  statuses: write

concurrency:
  group: nestjs-doctor-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  doctor:
    name: doctor (server + worker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # required for scope:changed (merge-base vs base branch)
      - uses: RoloBits/nestjs-doctor@bfc83dafb95b59d45d879d8756f01c1cf89054ab # v1
        with:
          node-version: 24
