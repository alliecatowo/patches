# A second, independent mirror of the docs/marketing site (site/) on GitHub Pages, so it
# survives losing either host on its own — the primary is Cloudflare Pages (.github/
# workflows/site.yml, project `patches-site`, live at https://patches-site.pages.dev).
# GitHub Pages serves a project site from a repo-name subpath
# (https://alliecatowo.github.io/patches/), unlike Cloudflare Pages' domain root, so this
# build sets VITEPRESS_BASE=/patches/ (site/.vitepress/config.mts reads it, default `/`)
# purely for this workflow — the Cloudflare build is untouched.
#
# One-time repository setup (Status: planned until the repo owner enables it): GitHub Pages must
# have "Source: GitHub Actions" enabled in the repo's Settings → Pages before this workflow's
# `actions/deploy-pages` step can publish anything — see docs/operations/site.md.

name: Site (GitHub Pages)

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: site-gh-pages-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  build:
    name: build
    # Only a successful push CI run for this repository's main branch is trusted to publish.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: ./.github/actions/setup

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Build the site (GitHub Pages base path)
        run: pnpm --filter @patches/site build
        env:
          VITEPRESS_BASE: /patches/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/.vitepress/dist

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
