version: 2

updates:
  # npm ecosystem auto-detects pnpm-lock.yaml, including `catalog:` entries (GA support
  # since Feb 2025).
  #
  # CAVEAT (docs/research/monorepo-toolchain.md §7, verified 2026-08-17): open upstream
  # dependabot-core issues as of mid-2026 report that Dependabot can drop `catalog:`
  # entries when it regenerates pnpm-lock.yaml, and that pnpm 11's multi-document
  # lockfile format has in some repos come back unparseable
  # (`dependency_file_not_parseable`). Treat every Dependabot pnpm-lockfile PR from this
  # config as needing manual review — do not auto-merge, and if a PR looks like it
  # dropped/mangled catalog entries, close it and bump the dependency by hand
  # (`pnpm add <pkg> --filter <workspace>` / `pnpm add -w -D <pkg>`) instead.
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    groups:
      dev-dependencies:
        dependency-type: 'development'
        patterns: ['*']
      production-dependencies:
        dependency-type: 'production'
        patterns: ['*']
    ignore:
      # ADR 0009: TypeScript stays pinned to the 5.9.x line (not 7.x) until
      # typescript-eslint and NestJS's decorator/emitDecoratorMetadata tooling are
      # validated against the TS7 native compiler. Don't let Dependabot open a major
      # bump PR for it.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    groups:
      actions:
        patterns: ['*']
