name: Feature request
description: Propose something new for Patches.
title: "[feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Patches has an opinionated product philosophy: chronological feeds,
        no engagement ranking, no algorithm deciding what you see. Not every
        good idea fits that — and that's fine to say up front, it just helps
        set expectations for the discussion.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What's frustrating, missing, or awkward today? Who does this affect?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What would you like to see instead? Be as concrete as you can.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about, and why you didn't propose them instead.
    validations:
      required: false

  - type: checkboxes
    id: principles
    attributes:
      label: Product principles check
      description: Read INITIAL_VISION.md §4 before checking this.
      options:
        - label: >
            This proposal does not conflict with Patches' core principles
            (no engagement ranking, chronological first, no hidden
            relevance/recommendation scoring).
          required: false
