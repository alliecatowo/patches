name: Setup toolchain
description: >
  Install Node + pnpm (pnpm/setup@v2), then `pnpm install --frozen-lockfile`.
  Also restores the Turborepo local cache. Used by every CI/CD job that needs
  the workspace installed.

runs:
  using: composite
  steps:
    - name: Install Node + pnpm
      uses: pnpm/setup@v2
      with:
        runtime: node@24.19.0
        cache: true

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: Restore turbo cache
      uses: actions/cache@v4
      with:
        path: .turbo
        key: turbo-${{ runner.os }}-${{ github.sha }}
        restore-keys: |
          turbo-${{ runner.os }}-
