# Fly.io app configuration for Patches (P7-001).
#
# Status: deployed 2026-08-18 as `patches-social` (patches-social.fly.dev). Deploy from the
# repo root (the pnpm workspace needs the whole monorepo as build context):
#
#   flyctl deploy --config infra/fly/fly.toml --remote-only --ha=false
#
# See docs/operations/deployment.md for the full runbook (secrets, Postgres, admin access).
app = "patches-social"
primary_region = "iad"

# Longer than the worker's 10s graceful drain and the server's in-flight gRPC drain (A-044);
# Fly's default is 5s, which would SIGKILL a worker mid-job.
kill_signal = "SIGTERM"
kill_timeout = "20s"

[build]
  dockerfile = "../docker/Dockerfile"

# Non-secret runtime env (secrets — DATABASE_URL, JWT_*, FEDERATION_KEY_ENCRYPTION_KEY,
# R2_*, RESEND_API_KEY — are set with `fly secrets set`). `GRPC_HOST=0.0.0.0` so the
# Machine's proxy can reach the listener; `PUBLIC_ORIGIN`/`NODE_DOMAIN` name this node.
[env]
  NODE_ENV = "production"
  LOG_LEVEL = "info"
  GRPC_HOST = "0.0.0.0"
  GRPC_PORT = "50051"
  HTTP_PORT = "8080"
  PUBLIC_ORIGIN = "https://patches-social.fly.dev"
  NODE_DOMAIN = "patches-social.fly.dev"
  INVITE_ONLY = "true"
  FEDERATION_ENABLED = "false"
  TRUST_PROXY_HEADERS = "true"
  EMAIL_PROVIDER = "resend"
  # Resend test sender until a real sending domain is verified (resend.com/domains) — delivers
  # only to the Resend account owner's address; other recipients fail until then (B-031).
  EMAIL_FROM = "Patches <onboarding@resend.dev>"

# One image, two process groups (docs/research/fly-io.md §1, §5). Fly runs each group's
# Machines with the corresponding command below, overriding the image's default CMD
# (`infra/docker/Dockerfile`'s CMD is only what runs under a plain `podman run`/`docker
# run`). Paths are relative to the runtime image's WORKDIR (/app), matching where
# `pnpm deploy` placed each app (see Dockerfile) — NOT `apps/server/dist/main.js`, since
# `pnpm deploy` flattens each app into its own top-level directory (`server/`, `worker/`).
[processes]
  server = "node server/dist/main.js"
  worker = "node worker/dist/main.js"

# Runs once per deploy, before new Machines take traffic (docs/research/fly-io.md §4).
# Gets the same secrets/env vars as the app (DATABASE_URL, etc.) but no volumes — fine,
# migrations don't need one. This is the ONLY place migrations run in production; the app
# itself hard-codes `migrationsRun: false` (packages/database's `createDataSourceOptions`)
# per spec §153.
[deploy]
  release_command = "node server/migrate.mjs"

# Public gRPC ingress — server group only. TLS terminates at Fly's edge; the app itself
# listens plain h2c on `internal_port` (docs/research/fly-io.md §2). `worker` intentionally
# has NO [[services]] block: it's a background job runner, not a request target, and gets
# no public (or even private) network service.
[[services]]
  internal_port = 50051
  protocol = "tcp"
  processes = ["server"]

  [[services.ports]]
    handlers = ["tls", "http"]
    port = 443

  [services.ports.http_options]
    h2_backend = true

  # Fly has no native gRPC check type (http/tcp only — docs/research/fly-io.md §3). This TCP
  # check only confirms the gRPC socket accepts connections, not that the app is actually
  # healthy — kept alongside the real application-level check below (`[checks.healthz]`)
  # rather than replaced by it, since a TCP check needs no application code at all to pass.
  [[services.tcp_checks]]
    grace_period = "10s"
    interval = "15s"
    timeout = "2s"

# Real application-level health check (A-043): `GET /healthz` on the server process's HTTP
# port, which reports 200 only when the database answers `SELECT 1` and the gRPC health
# status is SERVING (`apps/server/src/modules/system/health.service.ts`), 503 otherwise. A
# top-level `[checks]` entry rather than `[[services.http_checks]]` because HTTP_PORT is not
# a routed/public `[[services]]` block here — `[checks]` targets a port directly, independent
# of request routing (docs/research/fly-io.md §3). `FEDERATION_ENABLED=false` in `[env]`
# above means the server's HTTP port serves *only* `/healthz` (`healthz-server.ts`'s
# standalone listener, not Nest's own HTTP adapter) — nothing else is reachable on it.
[checks]
  [checks.healthz]
    type = "http"
    port = 8080
    method = "get"
    path = "/healthz"
    interval = "15s"
    timeout = "3s"
    grace_period = "10s"
    processes = ["server"]

[deploy.release_command_vm]
  size = "shared-cpu-1x"
  memory = "512mb"

# VM sizing per process group (`[[vm]]` blocks, or `fly scale vm --process-group=...`) is
# intentionally NOT set here — docs/research/fly-io.md didn't verify the current `[[vm]]`
# table syntax against official docs, and this file should only assert config that's
# actually been checked. Fly defaults new apps to a small shared-cpu Machine; set explicit
# sizing at first-deploy time once `[[vm]]`'s current syntax is confirmed against
# fly.io/docs/reference/configuration/.
