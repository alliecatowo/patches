# Local development dependencies for Patches.
# Usage (from repo root):  mise run compose -- up -d   (docker compose, or podman compose fallback)
# `minio` + `minio-init` are default-on (no profile needed) — a plain `up -d` gives you
# Postgres, mail, and R2-compatible object storage together (ADR 0015).
name: patches

services:
  postgres:
    image: docker.io/library/postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: patches
      POSTGRES_PASSWORD: patches
      POSTGRES_DB: patches
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro,z
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U patches -d patches']
      interval: 5s
      timeout: 3s
      retries: 20

  mailpit:
    image: docker.io/axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - '127.0.0.1:1025:1025' # SMTP
      - '127.0.0.1:8025:8025' # web UI
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: '1'
      MP_SMTP_AUTH_ALLOW_INSECURE: '1'

  minio:
    image: docker.io/minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: patches
      MINIO_ROOT_PASSWORD: patchespatches
    ports:
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'
    volumes:
      - minio-data:/data:z
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 3s
      retries: 20

  # One-shot: creates the dev media bucket, then exits. `docker compose up -d` starts it
  # alongside everything else; it depends on minio's healthcheck so it never races the
  # server not being ready yet. The bucket stays private (anonymous access off) — the API
  # always issues short-lived presigned GET URLs (`docs/architecture/media.md` §6), matching
  # R2's own private-by-default posture in production.
  minio-init:
    image: docker.io/minio/mc:latest
    restart: 'no'
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://minio:9000 patches patchespatches &&
        mc mb --ignore-existing local/patches-media &&
        mc anonymous set none local/patches-media &&
        echo 'minio-init: patches-media bucket ready'

volumes:
  postgres-data:
  minio-data:
