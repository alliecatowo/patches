[tools]
buf = "1.72.0"
node = "24.19.0"
pnpm = "11.22.0"
docker-compose = "5.4.0"
actionlint = "1.7.12"
lefthook = "2.1.10"
vhs = "latest"
ttyd = "latest"
"npm:neon" = "3.6.0"
# Powers Claude Code's `LSP` tool (go-to-definition / find-references / workspace symbols) via the
# typescript-lsp plugin, which spawns `typescript-language-server --stdio` off $PATH.
# See docs/agents/HARNESS.md "Symbolic search".
"npm:typescript-language-server" = "5.3.0"

[env]
# Lets `podman compose` reuse the compose binary mise installs (only used when docker is unavailable).
PODMAN_COMPOSE_PROVIDER = "{{config_root}}/.mise/bin/docker-compose"
PODMAN_COMPOSE_WARNING_LOGS = "false"
# One turbo cache for the main checkout AND every agent worktree (absolute path — a
# {{config_root}}-relative one would nest inside worktrees, which live in sibling dirs).
# Worktrees get it for free when they run under mise; .claude/hooks/worktree-setup.sh
# falls back to the same path when mise env isn't active. CI doesn't use mise [env],
# so it keeps the repo-local .turbo/ default, which .github/actions/setup already caches.
# Verified against turbo 2.10.10: TURBO_CACHE_DIR behaves exactly like --cache-dir.
TURBO_CACHE_DIR = "{{env.HOME}}/.cache/patches/turbo"

[tasks.compose]
description = "Run compose against infra/compose/docker-compose.yml (docker compose, falling back to podman compose)"
run = """
#!/usr/bin/env bash
set -euo pipefail
cd "$MISE_PROJECT_ROOT"
if command -v docker >/dev/null 2>&1 && docker info >/dev/null 2>&1; then
  exec docker compose -f infra/compose/docker-compose.yml "$@"
elif command -v podman >/dev/null 2>&1; then
  systemctl --user is-active --quiet podman.socket 2>/dev/null || systemctl --user start podman.socket 2>/dev/null || true
  mkdir -p .mise/bin
  [ -e .mise/bin/docker-compose ] || ln -sf "$(mise where docker-compose)/docker-cli-plugin-docker-compose" .mise/bin/docker-compose
  exec podman compose -f infra/compose/docker-compose.yml "$@"
else
  echo "Neither docker nor podman found. Install Docker (docker compose) or Podman." >&2
  exit 1
fi
"""

[tasks.setup]
description = "First-run setup: install deps, generate local secrets, git hooks, compose stack, migrations, build everything"
run = """
#!/usr/bin/env bash
set -euo pipefail
cd "$MISE_PROJECT_ROOT"
pnpm install
mise run hooks:install
if [ ! -f .env ]; then
  # Keep generated JWT and auth-envelope keys off the terminal and make the resulting local
  # secret file owner-readable only. Later definitions intentionally replace the documented
  # placeholders copied from .env.example.
  umask 077
  cp .env.example .env
  pnpm keys:generate >> .env
fi
mise run compose -- up -d
for i in $(seq 1 30); do (echo > /dev/tcp/127.0.0.1/5432) >/dev/null 2>&1 && break; sleep 1; done
pnpm db:migrate
pnpm build
echo "Ready. Next: 'mise run server' in one terminal, 'mise run tui' in another."
"""

[tasks."hooks:install"]
description = "Install lefthook's git hooks (B-008: prettier/eslint on staged files, pre-commit only — pnpm verify remains the real gate). Run once per clone; mise run setup already does this."
run = "cd \"$MISE_PROJECT_ROOT\" && lefthook install"

[tasks.server]
description = "Run the gRPC server (built) on 127.0.0.1:50051"
run = "cd \"$MISE_PROJECT_ROOT\" && pnpm --filter @patches/server build && pnpm --filter @patches/server start"

[tasks."server:dev"]
description = "Run the gRPC server in watch mode"
run = "cd \"$MISE_PROJECT_ROOT\" && pnpm --filter @patches/server dev"

[tasks.tui]
description = "Run the full-screen TUI against the local server (extra args pass through, e.g. -- --server host:port)"
# Runs from a private snapshot of dist/, not dist/ itself: an agent rebuilding
# apps/tui (or packages/terminal-media) while the TUI is open used to yank module
# files out from under it mid-session, which looks exactly like the app breaking
# (arrow keys "stopping", images "stopping"). See docs/agents/LEARNINGS.md.
run = """
cd "$MISE_PROJECT_ROOT"
pnpm --filter @patches/tui build >/dev/null
snapshot="${XDG_CACHE_HOME:-$HOME/.cache}/patches/tui-$$"
rm -rf "$snapshot" && mkdir -p "$snapshot"
cp -R apps/tui/dist/. "$snapshot/"
trap 'rm -rf "$snapshot"' EXIT
node "$snapshot/cli.js" --server "${PATCHES_SERVER:-127.0.0.1:50051}" --insecure "$@"
"""

[tasks.demos]
description = "Render every VHS tape in infra/demos/tapes/ (TUI screenshots + GIFs for README/site) — see infra/demos/render.sh for required session env vars. Not idempotent: re-running posts/follows for real against the live node (P9-002)."
run = "cd \"$MISE_PROJECT_ROOT\" && infra/demos/render.sh"

[tasks.admin]
description = "Run the patches-admin moderation CLI (built) against the local Postgres database — extra args pass through, e.g. `mise run admin -- user list`"
run = "cd \"$MISE_PROJECT_ROOT\" && pnpm --filter @patches/admin build >/dev/null && node apps/admin/dist/main.js \"$@\""

[tasks.worker]
description = "Run the job worker (built) against the local Postgres outbox"
run = "cd \"$MISE_PROJECT_ROOT\" && pnpm --filter @patches/worker build && pnpm --filter @patches/worker start"

[tasks."worker:dev"]
description = "Run the job worker in watch mode"
run = "cd \"$MISE_PROJECT_ROOT\" && pnpm --filter @patches/worker dev"

[tasks."tui:prod"]
description = "Run the TUI against the live flagship node (patches-social.fly.dev:443, TLS) — same as plain `patches`"
# Snapshotted for the same reason as `mise run tui` above.
run = """
cd "$MISE_PROJECT_ROOT"
pnpm --filter @patches/tui build >/dev/null
snapshot="${XDG_CACHE_HOME:-$HOME/.cache}/patches/tui-$$"
rm -rf "$snapshot" && mkdir -p "$snapshot"
cp -R apps/tui/dist/. "$snapshot/"
trap 'rm -rf "$snapshot"' EXIT
node "$snapshot/cli.js" --server "${PATCHES_SERVER:-patches-social.fly.dev:443}" "$@"
"""

[tasks."tui:release"]
description = "Build + pack the TUI release tarball and create a GitHub prerelease from it (bump apps/tui/package.json's version first) — see docs/operations/release.md. Add --pack-only to stop after packing (no `gh release create`, no GitHub write)."
run = "cd \"$MISE_PROJECT_ROOT\" && infra/scripts/tui-release.sh \"$@\""

[tasks."ping:prod"]
description = "Connectivity check against the live flagship node"
run = "cd \"$MISE_PROJECT_ROOT\" && node apps/tui/dist/cli.js ping --server \"${PATCHES_SERVER:-patches-social.fly.dev:443}\""

[tasks.ping]
description = "Non-interactive connectivity check against the local server (JSON, exit 0/1)"
run = "cd \"$MISE_PROJECT_ROOT\" && node apps/tui/dist/cli.js ping --server \"${PATCHES_SERVER:-127.0.0.1:50051}\" --insecure"

[tasks.usage]
description = "Report agent context economy (cache reads, batching, narration, agent lifetime) from the Claude Code transcripts — see docs/agents/CONTEXT_ECONOMY.md. `--json` for machine-readable, `--since <date>` to scope."
run = "cd \"$MISE_PROJECT_ROOT\" && node infra/scripts/usage-report.mjs"

[tasks.site]
description = "Run the VitePress docs/marketing site in dev mode (site/) at http://localhost:5173"
run = "cd \"$MISE_PROJECT_ROOT\" && pnpm site:dev"

[tasks."site:deploy"]
description = "Build the site and deploy site/.vitepress/dist to Cloudflare Pages (project patches-site) via wrangler — wrangler is authenticated locally via OAuth (`pnpm exec wrangler whoami`); gated in CI behind vars.SITE_DEPLOY_ENABLED (.github/workflows/site.yml)"
run = "cd \"$MISE_PROJECT_ROOT\" && pnpm site:deploy"

[tasks.web]
description = "Run the @patches/web dev server (http://localhost:5173) — proxies /api to the live node by default (PATCHES_DEV_UPSTREAM overrides for a local server, see apps/web/README.md)"
run = "cd \"$MISE_PROJECT_ROOT\" && pnpm --filter @patches/web dev"

[tasks."web:deploy"]
description = "Build @patches/web (VITE_PATCHES_API_BASE set for production, no dev proxy) and deploy apps/web/dist to Cloudflare Pages (project patches-web) via wrangler — wrangler is authenticated locally via OAuth (`pnpm exec wrangler whoami`); see docs/operations/web.md"
run = """
#!/usr/bin/env bash
set -euo pipefail
cd "$MISE_PROJECT_ROOT"
VITE_PATCHES_API_BASE="${VITE_PATCHES_API_BASE:-https://patches-social.fly.dev:8443}" pnpm --filter @patches/web build
pnpm exec wrangler pages deploy apps/web/dist --project-name patches-web --branch main --commit-dirty=true
"""

[tasks.spike]
description = "Kitty graphics spike — run inside kitty or Ghostty (j/k move, R rerender, d delete, q quit)"
run = "cd \"$MISE_PROJECT_ROOT\" && pnpm --filter @patches/terminal-media spike"

[tasks.verify]
description = "format + lint + typecheck + unit tests (the pre-commit gate)"
run = "cd \"$MISE_PROJECT_ROOT\" && pnpm verify"

[tasks.check]
description = "Scoped check for one workspace: typecheck + tests + lint + format. `mise run check tui` (or `web`, `server`, `@patches/tui`). This is THE command to use while working — it runs under the pinned Node, so no `zsh -i`, no `mise exec`, no hand-rolled `&&` chains."
run = """
#!/usr/bin/env bash
set -euo pipefail
cd "$MISE_PROJECT_ROOT"
name="${1:?usage: mise run check <workspace>   e.g. tui, web, server, @patches/tui}"
case "$name" in @patches/*) pkg="$name" ;; *) pkg="@patches/$name" ;; esac
dir="$(node -e 'const{execSync}=require("child_process");const l=JSON.parse(execSync("pnpm ls -r --depth -1 --json",{encoding:"utf8"}));const m=l.find(p=>p.name===process.argv[1]);if(!m){console.error("unknown workspace: "+process.argv[1]);process.exit(1)}process.stdout.write(m.path)' "$pkg")"
  echo "→ $pkg  ($dir)"
  # typecheck+test in one turbo invocation: dependency-ordered, parallel, and cached —
  # an unchanged workspace replays in ~0s instead of re-running vitest every time.
  pnpm exec turbo run typecheck test --filter="$pkg" --output-logs=errors-only
# eslint was missing here until 2026-08-20, so agents kept reporting a workspace green
# and then tripping lefthook's eslint at commit time (import-type, no-misused-promises,
# no-empty-object-type). The pre-commit hook must never be the first place lint runs.
pnpm exec eslint "$dir" --cache --cache-location node_modules/.cache/eslint/
pnpm exec prettier --check "$dir"
echo "✓ $pkg is green"
"""

[tasks.test]
description = "All tests including integration (needs the compose stack)"
# `pnpm test` is now `turbo run test` (unit tests only, cached); the integration projects
# are a separate explicit run so they never get turbo-cached (DB-dependent = uncacheable).
run = "cd \"$MISE_PROJECT_ROOT\" && export TEST_DATABASE_URL=\"${TEST_DATABASE_URL:-postgres://patches:patches@127.0.0.1:5432/patches_test}\" && pnpm test && pnpm test:integration"

[tasks.down]
description = "Stop the compose stack"
run = "cd \"$MISE_PROJECT_ROOT\" && mise run compose -- down"

[tasks."fed:lab"]
description = "Manual two-node federation lab (B-029): builds server/worker/tui, starts node A (grpc 50061/http 8081) and node B (grpc 50062/http 8082) plus a worker each against dedicated patches_lab_a/patches_lab_b databases, prints next steps, tails logs — see docs/operations/federation.md 'Manual two-node lab'"
run = "cd \"$MISE_PROJECT_ROOT\" && infra/lab/fed-lab.sh up"

[tasks."fed:lab:down"]
description = "Stop the federation lab started by `mise run fed:lab` (kills the PIDs recorded in infra/lab/.run/)"
run = "cd \"$MISE_PROJECT_ROOT\" && infra/lab/fed-lab.sh down"

[tasks."docker:build"]
description = "Build the production image locally (podman, falling back to docker) — see infra/docker/Dockerfile"
run = """
#!/usr/bin/env bash
set -euo pipefail
cd "$MISE_PROJECT_ROOT"
if command -v podman >/dev/null 2>&1; then
  exec podman build -t patches:local -f infra/docker/Dockerfile .
elif command -v docker >/dev/null 2>&1; then
  exec docker build -t patches:local -f infra/docker/Dockerfile .
else
  echo "Neither podman nor docker found." >&2
  exit 1
fi
"""

[tasks."fly:deploy"]
description = "Deploy to Fly.io (needs `flyctl` authenticated + infra/fly/fly.toml's app name set — see docs/operations/deployment.md). Runs from this environment against app `patches-social` (Fly + Fly Postgres, region iad)."
run = "cd \"$MISE_PROJECT_ROOT\" && flyctl deploy --config infra/fly/fly.toml --remote-only"

[tasks."fly:migrate"]
description = "Run the release-command migration step manually against whatever DATABASE_URL/secrets flyctl currently resolves (infra/fly/fly.toml's release_command does this automatically on every deploy; this task is for a manual out-of-band run)."
run = "cd \"$MISE_PROJECT_ROOT\" && flyctl ssh console --config infra/fly/fly.toml --command 'node server/migrate.mjs'"

[tasks."fly:logs"]
description = "Tail production logs for app `patches-social`."
run = "cd \"$MISE_PROJECT_ROOT\" && flyctl logs --config infra/fly/fly.toml"

[tasks."db:dump"]
description = "Logical backup of the Neon production database (or DATABASE_URL, if set) to backups/patches-<UTC timestamp>.sql.gz via podman pg_dump — see docs/operations/backups.md (A-042)"
run = "cd \"$MISE_PROJECT_ROOT\" && infra/scripts/db-dump.sh"

[tasks."db:restore"]
description = "Restore a dump produced by `mise run db:dump` into a target database: `mise run db:restore -- <dump.sql.gz> <target DATABASE_URL> [--yes] [--i-know-this-is-production]` — see docs/operations/backups.md (A-042)"
run = "cd \"$MISE_PROJECT_ROOT\" && infra/scripts/db-restore.sh \"$@\""

[tasks."neon:dev:create"]
description = "Create an expiring Neon child of the configured anonymized dev mirror (never defaults to production)"
run = "cd \"$MISE_PROJECT_ROOT\" && infra/scripts/neon-dev-branch.sh create \"$@\""

[tasks."neon:dev:status"]
description = "Print JSON status for the current ephemeral Neon dev branch"
run = "cd \"$MISE_PROJECT_ROOT\" && infra/scripts/neon-dev-branch.sh status \"$@\""

[tasks."neon:dev:connect"]
description = "Connect psql to the current ephemeral Neon dev branch without printing its connection string"
run = "cd \"$MISE_PROJECT_ROOT\" && infra/scripts/neon-dev-branch.sh connect \"$@\""

[tasks."neon:dev:migrate"]
description = "Apply Patches migrations to the current ephemeral Neon dev branch"
run = "cd \"$MISE_PROJECT_ROOT\" && infra/scripts/neon-dev-branch.sh migrate \"$@\""

[tasks."neon:dev:test"]
description = "Run the integration suite against the current ephemeral Neon dev branch"
run = "cd \"$MISE_PROJECT_ROOT\" && infra/scripts/neon-dev-branch.sh test \"$@\""

[tasks."neon:dev:reset"]
description = "Destructively reset the current ephemeral Neon dev branch to its anonymized mirror parent"
run = "cd \"$MISE_PROJECT_ROOT\" && infra/scripts/neon-dev-branch.sh reset \"$@\""

[tasks."neon:dev:destroy"]
description = "Permanently delete the current ephemeral Neon dev branch"
run = "cd \"$MISE_PROJECT_ROOT\" && infra/scripts/neon-dev-branch.sh destroy \"$@\""
